<style>
/* ── Page header ── */
.cta-page-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.cta-page-header h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;text-transform:uppercase;letter-spacing:0.02em;margin:0;flex:1;}

/* ── List table ── */
.cta-card{background:var(--dark2);border:1px solid rgba(255,255,255,0.07);border-radius:10px;overflow:hidden;}
.cta-table{width:100%;border-collapse:collapse;}
.cta-table th{text-align:left;font-size:0.67rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);padding:0.55rem 1rem;border-bottom:1px solid rgba(255,255,255,0.06);white-space:nowrap;}
.cta-table td{padding:0.65rem 1rem;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;font-size:0.85rem;color:var(--gray-light);}
.cta-table tr:last-child td{border-bottom:none;}
.cta-table tbody tr:hover td{background:rgba(255,255,255,0.018);}
.col-name{color:var(--white);font-weight:700;}
.col-title{color:var(--gray-light);}
.col-btn-text{font-size:0.78rem;}
.col-link{font-family:monospace;font-size:0.72rem;color:var(--gray);}
.col-usage{font-size:0.8rem;color:var(--gray);white-space:nowrap;}
.col-usage.used{color:var(--accent);font-weight:700;}
.col-actions{text-align:right;white-space:nowrap;}

/* ── Small action buttons ── */
.ax{font-family:'Barlow',sans-serif;font-size:0.74rem;font-weight:700;padding:0.26rem 0.62rem;border-radius:5px;cursor:pointer;white-space:nowrap;transition:background 0.15s,border-color 0.15s,color 0.15s;}
.ax-default{background:transparent;border:1px solid rgba(255,255,255,0.12);color:var(--gray-light);}
.ax-default:hover{border-color:rgba(255,255,255,0.3);color:var(--white);}
.ax-danger{background:transparent;border:1px solid rgba(232,64,64,0.3);color:#ff8080;}
.ax-danger:hover{background:var(--red-dim);border-color:var(--red);}
.ax + .ax{margin-left:0.28rem;}
.del-confirm-note{font-size:0.74rem;color:var(--gray);margin-right:0.35rem;font-style:italic;}

/* ── Empty + loading ── */
.empty-row td{text-align:center;padding:2.5rem;color:var(--gray);font-size:0.85rem;font-style:italic;}
.panel-loading{font-size:0.78rem;color:var(--gray);font-style:italic;}

/* ── Add/Edit form modal ── */
.form-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.74);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:600;display:none;align-items:center;justify-content:center;padding:1rem;}
.form-overlay.open{display:flex;}
.form-box{background:var(--dark2);border:1px solid rgba(255,255,255,0.1);border-radius:13px;padding:1.75rem 2rem;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,0.6);}
.form-box h3{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.1rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--white);margin:0 0 1.25rem 0;}
.form-box .admin-field{margin-bottom:1rem;}
.form-box .admin-field:last-of-type{margin-bottom:1.25rem;}
.form-footer{display:flex;gap:0.5rem;justify-content:flex-end;margin-top:0.5rem;}

/* ── In-table delete confirm ── */
.inline-del td{background:var(--red-dim)!important;}

/* ── Seed CTA banner ── */
.seed-banner{background:rgba(0,212,255,0.07);border:1px solid rgba(0,212,255,0.2);border-radius:9px;padding:0.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap;}
.seed-banner p{font-size:0.82rem;color:var(--gray-light);margin:0;line-height:1.5;}
.seed-banner p strong{color:var(--accent);}

/* ── CTA preview card (inside form) ── */
.cta-preview-block{background:rgba(26,79,255,0.07);border:1px solid rgba(26,79,255,0.22);border-radius:8px;padding:0.85rem 1rem;margin-top:-0.25rem;margin-bottom:1rem;}
.cta-preview-block .pv-label{font-size:0.67rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue-light);margin-bottom:0.4rem;}
.cta-preview-block .pv-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1rem;color:var(--white);margin-bottom:0.28rem;}
.cta-preview-block .pv-desc{font-size:0.78rem;color:var(--gray-light);line-height:1.55;margin-bottom:0.55rem;}
.cta-preview-block .pv-btn{display:inline-block;background:var(--blue);color:#fff;font-family:'Barlow',sans-serif;font-size:0.75rem;font-weight:700;padding:0.32rem 0.85rem;border-radius:5px;pointer-events:none;}
.cta-preview-block .pv-icon{color:var(--accent);margin-bottom:0.45rem;}
.cta-preview-block .pv-btns{display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;}
.cta-preview-block .pv-btn-secondary{font-size:0.75rem;color:var(--gray-light);text-decoration:underline;pointer-events:none;}
.cta-preview-block.pv-accent{background:rgba(0,212,255,0.09);border-color:rgba(0,212,255,0.4);}
.cta-preview-block.pv-accent .pv-icon{color:var(--accent);}
.cta-preview-block.pv-subtle{background:rgba(255,255,255,0.02);border-color:rgba(255,255,255,0.08);}
/* Small inline badges shown in the template list */
.style-badge{display:inline-block;font-size:0.6rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:0.1rem 0.4rem;border-radius:3px;vertical-align:middle;margin-left:0.35rem;background:rgba(255,255,255,0.07);color:var(--gray-light);}
.style-badge-accent{background:rgba(0,212,255,0.12);color:var(--accent);}
.style-badge-subtle{background:rgba(255,255,255,0.05);color:var(--gray);}
.style-badge-icon{background:rgba(26,79,255,0.15);color:var(--blue-light);}
.style-badge-sec{background:rgba(26,79,255,0.1);color:var(--blue-light);}

/* ── Add-new toolbar ── */
.cta-toolbar{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;border-bottom:1px solid rgba(255,255,255,0.06);}
.cta-toolbar-left{display:flex;align-items:center;gap:0.75rem;}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="content-utils.js"></script>
</head>
<body>

<div id="app" style="display:none;">
  <div id="admin-nav"></div>

  <main class="admin-main">

    <div class="cta-page-header">
      <a class="btn-secondary" href="blog-admin.html"
         style="font-size:0.8rem;padding:0.45rem 0.9rem;min-height:unset;text-decoration:none;">

<!-- ══════════════════════════════════════
     CREATE / EDIT MODAL
══════════════════════════════════════ -->
<div class="form-overlay" id="form-overlay" onclick="if(event.target===this)closeForm()">
  <div class="form-box">
    <h3 id="form-title">Ny CTA-mall</h3>

    <div class="admin-field">

      <label for="f-sec-btn-link">Sekund&#228;r knappl&#228;nk <span style="font-weight:400;color:var(--gray);">(valfri)</span></label>

    <!-- Live preview updates as the admin types — no extra query needed -->

      <div class="pv-label">F&#246;rhandsvisning</div>
      <div class="pv-icon" id="pv-icon" style="display:none;"></div>
      <div class="pv-title" id="pv-title"></div>
      <div class="pv-desc"  id="pv-desc"></div>
      <div class="pv-btns">

        <span class="pv-btn-secondary" id="pv-btn-secondary" style="display:none;"></span>

      <button class="btn-primary"
              style="font-size:0.82rem;min-height:unset;padding:0.48rem 1.1rem;"
              onclick="submitForm()" id="form-submit-btn">Spara</button>
    </div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════

var allTemplates = [];   // {id, name, title, description, button_text, button_link}[]
var usage        = {};   // {String(id): count} — blog_posts using each template
var editingId    = null; // null = creating new, string = editing existing
var deletingId   = null; // row currently in confirm-delete state

// ════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════

(async function init() {
  var session = await checkAuth();
  if (!session) return;

  renderAdminNav('blog');
  document.getElementById('sidebar-user-email').textContent = session.user.email;
  document.getElementById('app').style.display = 'flex';

  await loadTemplates();
})();

// ════════════════════════════════════════════════════════════════════
// LOAD DATA
// ════════════════════════════════════════════════════════════════════

async function loadTemplates() {
  var tplRes  = await supabaseClient.from('cta_templates').select('*').order('name');
  // Fetch all blog_posts cta_template_id values in one call, aggregate locally
  var postRes = await supabaseClient.from('blog_posts').select('cta_template_id');

  document.getElementById('list-loading').style.display = 'none';

  if (tplRes.error) {
    showToast('Kunde inte ladda mallar: ' + tplRes.error.message, 't-red');
    return;
  }

  allTemplates = tplRes.data || [];

  usage = {};
  if (!postRes.error) {
    (postRes.data || []).forEach(function(p) {
      if (p.cta_template_id != null) {
        var k = String(p.cta_template_id);
        usage[k] = (usage[k] || 0) + 1;
      }
    });
  }

  // Show seed banner only when there are no templates yet
  document.getElementById('seed-banner').style.display = allTemplates.length === 0 ? 'flex' : 'none';

  renderList();
}

// ════════════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════════════

function renderList() {
  var tbody = document.getElementById('cta-tbody');

  if (!allTemplates.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">Inga CTA-mallar &#228;n.</td></tr>';
    return;
  }

  tbody.innerHTML = allTemplates.map(function(t) {
    var id    = String(t.id);
    var count = usage[id] || 0;
    var isDel = deletingId === id;

    var actions;
    if (isDel) {
      var note = count > 0
        ? '<span class="del-confirm-note">Anv&#228;nds av ' + count + ' art. &#8212; nollst&#228;ll dessa?</span>'
        : '<span class="del-confirm-note">S&#228;ker?</span>';
      actions =
        note +
        '<button class="ax ax-danger" onclick="doDelete(\'' + id + '\',' + (count > 0) + ')">Ja, ta bort</button>' +
        '<button class="ax ax-default" onclick="cancelDelete()">Avbryt</button>';
    } else {
      actions =
        '<button class="ax ax-default" onclick="openForm(\'' + id + '\')">Redigera</button>' +
        '<button class="ax ax-danger"  onclick="startDelete(\'' + id + '\')">Ta bort</button>';
    }

    var badges = '';
    if (t.style_variant && t.style_variant !== 'default') {
      badges += '<span class="style-badge style-badge-' + escH(t.style_variant) + '">' + escH(t.style_variant) + '</span>';
    }
    if (t.icon && t.icon !== 'none') {
      badges += '<span class="style-badge style-badge-icon">' + escH(t.icon) + '</span>';
    }
    if (t.secondary_button_text) {
      badges += '<span class="style-badge style-badge-sec">+2&nbsp;knappar</span>';
    }

    return '<tr' + (isDel ? ' class="inline-del"' : '') + '>' +
      '<td class="col-name">'     + escH(t.name        || '') + badges + '</td>' +
      '<td class="col-title">'    + escH(t.title       || '') + '</td>' +
      '<td class="col-btn-text">' + escH(t.button_text || '') + '</td>' +
      '<td class="col-link">'     + escH(t.button_link || '') + '</td>' +
      '<td class="col-usage' + (count > 0 ? ' used' : '') + '">' +
        count + '&nbsp;art.' +
      '</td>' +
      '<td class="col-actions">' + actions + '</td>' +
      '</tr>';
  }).join('');
}

// ════════════════════════════════════════════════════════════════════
// FORM — OPEN / CLOSE / PREVIEW
// ════════════════════════════════════════════════════════════════════

function openForm(id) {
  editingId = id;
  deletingId = null;

  if (id) {
    var t = allTemplates.find(function(x) { return String(x.id) === id; });
    document.getElementById('form-title').textContent   = 'Redigera CTA-mall';
    document.getElementById('f-name').value             = t ? (t.name                 || '') : '';
    document.getElementById('f-title').value            = t ? (t.title                || '') : '';
    document.getElementById('f-desc').value             = t ? (t.description          || '') : '';
    document.getElementById('f-btn-text').value         = t ? (t.button_text          || '') : '';
    document.getElementById('f-btn-link').value         = t ? (t.button_link          || '') : '';
    document.getElementById('f-sec-btn-text').value     = t ? (t.secondary_button_text || '') : '';
    document.getElementById('f-sec-btn-link').value     = t ? (t.secondary_button_url  || '') : '';
    document.getElementById('f-icon').value             = t ? (t.icon          || 'none')    : 'none';
    document.getElementById('f-style').value            = t ? (t.style_variant || 'default') : 'default';
  } else {
    document.getElementById('form-title').textContent = 'Ny CTA-mall';
    document.getElementById('f-name').value         = '';
    document.getElementById('f-title').value        = '';
    document.getElementById('f-desc').value         = '';
    document.getElementById('f-btn-text').value     = '';
    document.getElementById('f-btn-link').value     = '';
    document.getElementById('f-sec-btn-text').value = '';
    document.getElementById('f-sec-btn-link').value = '';
    document.getElementById('f-icon').value         = 'none';
    document.getElementById('f-style').value        = 'default';
  }

  refreshPreview();
  document.getElementById('form-overlay').classList.add('open');
  document.getElementById('f-name').focus();
}

function closeForm() {
  document.getElementById('form-overlay').classList.remove('open');
  editingId = null;
}

function refreshPreview() {
  var title      = document.getElementById('f-title').value.trim();
  var desc       = document.getElementById('f-desc').value.trim();
  var btnText    = document.getElementById('f-btn-text').value.trim();
  var secBtnText = document.getElementById('f-sec-btn-text').value.trim();
  var icon       = document.getElementById('f-icon').value;
  var style      = document.getElementById('f-style').value;
  var block      = document.getElementById('form-preview');

  if (!title && !desc && !btnText) {
    block.style.display = 'none';
    return;
  }

  // Icon
  var iconEl = document.getElementById('pv-icon');
  var iconSvg = getCtaIconSvg(icon);
  iconEl.innerHTML    = iconSvg;
  iconEl.style.display = iconSvg ? 'block' : 'none';

  document.getElementById('pv-title').textContent = title;
  document.getElementById('pv-desc').textContent  = desc;
  document.getElementById('pv-btn').textContent   = btnText;

  // Secondary button
  var secEl = document.getElementById('pv-btn-secondary');
  secEl.textContent   = secBtnText;
  secEl.style.display = secBtnText ? 'inline-block' : 'none';

  // Style variant
  block.classList.remove('pv-accent', 'pv-subtle');
  if (style === 'accent') block.classList.add('pv-accent');
  if (style === 'subtle') block.classList.add('pv-subtle');

  block.style.display = 'block';
}

// ════════════════════════════════════════════════════════════════════
// FORM — SUBMIT (create or update)
// ════════════════════════════════════════════════════════════════════

async function submitForm() {
  var name       = document.getElementById('f-name').value.trim();
  var title      = document.getElementById('f-title').value.trim();
  var desc       = document.getElementById('f-desc').value.trim();
  var btnText    = document.getElementById('f-btn-text').value.trim();
  var btnLink    = document.getElementById('f-btn-link').value.trim();
  var secBtnText = document.getElementById('f-sec-btn-text').value.trim() || null;
  var secBtnLink = document.getElementById('f-sec-btn-link').value.trim() || null;
  var icon       = document.getElementById('f-icon').value  || 'none';
  var styleVar   = document.getElementById('f-style').value || 'default';

  if (!name)    { showToast('Namn kr&#228;vs.', 't-red');      return; }
  if (!title)   { showToast('Titel kr&#228;vs.', 't-red');     return; }
  if (!btnText) { showToast('Knapptext kr&#228;vs.', 't-red'); return; }
  if (!btnLink) { showToast('Knappl&#228;nk kr&#228;vs.', 't-red'); return; }

  var payload = {
    name: name, title: title, description: desc,
    button_text: btnText, button_link: btnLink,
    secondary_button_text: secBtnText,
    secondary_button_url:  secBtnLink,
    icon:          icon,
    style_variant: styleVar,
  };

  if (editingId) {
    var res = await supabaseClient.from('cta_templates').update(payload).eq('id', editingId).select().single();
    if (res.error) { showToast('Kunde inte spara: ' + res.error.message, 't-red'); return; }
    var idx = allTemplates.findIndex(function(t) { return String(t.id) === editingId; });
    if (idx !== -1) allTemplates[idx] = res.data;
    showToast('CTA-mall uppdaterad.', 't-green');
  } else {
    var ins = await supabaseClient.from('cta_templates').insert(payload).select().single();
    if (ins.error) { showToast('Kunde inte skapa: ' + ins.error.message, 't-red'); return; }
    allTemplates.push(ins.data);
    allTemplates.sort(function(a, b) { return a.name.localeCompare(b.name, 'sv'); });
    document.getElementById('seed-banner').style.display = 'none';
    showToast('CTA-mall skapad.', 't-green');
  }

  closeForm();
  renderList();
}

// ════════════════════════════════════════════════════════════════════
// DELETE
// On delete of an in-use template: set affected blog_posts.cta_template_id to null
// first, so no dangling FK references remain. The warning in the confirm step
// ("Används av X art.") prompts the confirm button label to say "Ja, ta bort"
// and the doDelete() call receives clearPosts=true to trigger the nullification.
// ════════════════════════════════════════════════════════════════════

function startDelete(id) {
  deletingId = id;
  renderList();
}

function cancelDelete() {
  deletingId = null;
  renderList();
}

async function doDelete(id, clearPosts) {
  if (clearPosts) {
    // Nullify cta_template_id on all blog_posts referencing this template
    // to avoid dangling FK references before the template row is deleted
    var nullify = await supabaseClient
      .from('blog_posts')
      .update({ cta_template_id: null })
      .eq('cta_template_id', id);
    if (nullify.error) {
      showToast('Kunde inte nollst&#228;lla artiklar: ' + nullify.error.message, 't-red');
      return;
    }
  }

  var del = await supabaseClient.from('cta_templates').delete().eq('id', id);
  if (del.error) { showToast('Kunde inte ta bort: ' + del.error.message, 't-red'); return; }

  allTemplates = allTemplates.filter(function(t) { return String(t.id) !== id; });
  delete usage[id];
  deletingId = null;

  document.getElementById('seed-banner').style.display = allTemplates.length === 0 ? 'flex' : 'none';
  renderList();
  showToast('CTA-mall borttagen.', 't-amber');
}
