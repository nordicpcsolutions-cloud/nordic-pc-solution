<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0Ij48cmVjdCB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHJ4PSIxMiIgZmlsbD0iIzBhMGYxZSIvPjx0ZXh0IHg9IjMyIiB5PSI0NyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsIEJsYWNrLHNhbnMtc2VyaWYiIGZvbnQtd2VpZ2h0PSI5MDAiIGZvbnQtc2l6ZT0iNDQiIGZpbGw9IiMxYTRmZmYiPlA8L3RleHQ+PC9zdmc+">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rea &amp; Priser – Nordic PC Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shared.css">
<style>
.page-hd { margin-bottom: 1.75rem; }
.page-hd h1 { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:1.85rem; letter-spacing:0.02em; text-transform:uppercase; }

/* Status card toggle area */
.status-toggle-row  { display:flex; align-items:center; gap:1rem; flex:1; }
.status-toggle-meta { display:flex; flex-direction:column; gap:0.2rem; }
.status-toggle-lbl  { font-size:0.72rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray); }
.status-toggle-desc { font-size:0.83rem; color:var(--gray); }

/* Prices reference table */
.prices-card { background:var(--dark2); border:1px solid rgba(255,255,255,0.07); border-radius:12px; padding:1.8rem 2rem; }
.prices-card h3 { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:1.1rem; text-transform:uppercase; margin-bottom:1.2rem; color:var(--gray-light); }
.prices-table { width:100%; border-collapse:collapse; }
.prices-table th { background:var(--dark3); padding:0.75rem 1rem; text-align:left; font-size:0.7rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--gray); border-bottom:1px solid rgba(255,255,255,0.07); }
.prices-table td { padding:0.85rem 1rem; font-size:0.9rem; color:var(--gray-light); border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
.prices-table tr:last-child td { border-bottom:none; }
.price-orig   { font-weight:700; color:var(--white); }
.price-sale   { font-weight:700; color:var(--green); }
.price-strike { text-decoration:line-through; color:var(--gray); font-weight:400; font-size:0.82rem; margin-right:0.4rem; }
.applies-dot  { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:0.45rem; vertical-align:middle; }

/* Inline save confirmation */
.save-row   { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
.save-flash { font-size:0.8rem; color:var(--green); opacity:0; transition:opacity 0.3s; }
.save-flash.show { opacity:1; }

/* Checkbox group for "Gäller för" — spans full grid width */
.applies-group {
  grid-column: 1 / -1;
  display: flex; flex-direction: column; gap: 0.38rem;
}
.applies-group > label:first-child {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--gray);
}
.cb-list {
  display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem;
  background: var(--dark3); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 7px; padding: 0.75rem 0.9rem;
}
.cb-item {
  display: flex; align-items: center; gap: 0.45rem;
  font-size: 0.88rem; color: var(--gray-light); cursor: pointer;
  user-select: none;
}
.cb-item input[type="checkbox"] {
  width: 16px; height: 16px; accent-color: var(--blue); cursor: pointer; flex-shrink: 0;
}
.cb-item.cb-all-item { color: var(--white); font-weight: 700; }
.cb-item.disabled    { opacity: 0.4; pointer-events: none; }

@media(max-width:600px) { .sale-form-grid { grid-template-columns:1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="admin-shared.js"></script>
</head>
<body>

<div id="app" style="display:none;">

  <div id="admin-nav"></div>

  <main class="admin-main">

    <div class="page-hd">
      <h1>Rea &amp; Priser</h1>
    </div>

    <!-- ── STATUS TOGGLE CARD ── -->
    <div class="sale-status-card">
      <div class="status-toggle-row">
        <label class="toggle-switch" title="Aktivera / inaktivera rea">
          <input type="checkbox" id="toggle-active" onchange="saveToggle()">
          <span class="toggle-slider"></span>
        </label>
        <div class="status-toggle-meta">
          <span class="status-toggle-lbl">Rea-status</span>
          <span class="status-toggle-desc" id="status-desc">Laddar&#8230;</span>
        </div>
      </div>
      <div class="sale-status-badge off" id="status-badge">Ingen rea aktiv</div>
    </div>

    <!-- ── SETTINGS FORM ── -->
    <div class="sale-form-card">
      <h3>Rea&#8209;inst&#228;llningar</h3>

      <div class="sale-form-grid">
        <div class="sale-field">
          <label for="f-percent">Rabatt (%)</label>
          <input type="number" id="f-percent" min="1" max="99" placeholder="T.ex. 20" oninput="renderPriceTable()">
        </div>
        <div class="sale-field">
          <label for="f-title">Reatitel</label>
          <input type="text" id="f-title" placeholder="T.ex. Sommarrea 2025" maxlength="80">
        </div>
        <div class="sale-field">
          <label for="f-end-date">Slutdatum</label>
          <input type="date" id="f-end-date">
        </div>
        <div class="applies-group">
          <label>G&#228;ller f&#246;r</label>
          <div class="cb-list">
            <label class="cb-item cb-all-item">
              <input type="checkbox" id="cb-all" value="all" onchange="onAllaChange()">
              Alla tj&#228;nster
            </label>
            <label class="cb-item">
              <input type="checkbox" class="cb-service" value="grundtjanst" onchange="onServiceChange()">
              Grundtj&#228;nst
            </label>
            <label class="cb-item">
              <input type="checkbox" class="cb-service" value="pro_bygge" onchange="onServiceChange()">
              Pro-bygge
            </label>
            <label class="cb-item">
              <input type="checkbox" class="cb-service" value="skraddarsydd" onchange="onServiceChange()">
              Skr&#228;ddarsydd PC
            </label>
            <label class="cb-item">
              <input type="checkbox" class="cb-service" value="djuprenoring" onchange="onServiceChange()">
              Djupreng&#246;ring
            </label>
          </div>
        </div>
      </div>

      <div class="save-row">
        <button class="sale-save-btn" onclick="saveSettings()">Uppdatera</button>
        <span class="save-flash" id="save-flash">&#10003; Sparat</span>
      </div>
    </div>

    <!-- ── PRICES REFERENCE ── -->
    <div class="prices-card">
      <h3>Ordinarie priser</h3>
      <table class="prices-table">
        <thead>
          <tr>
            <th>Tj&#228;nst</th>
            <th>Ordinarie pris</th>
            <th id="sale-col-hd" style="display:none;">Reans pris</th>
          </tr>
        </thead>
        <tbody id="prices-tbody"></tbody>
      </table>
    </div>

  </main>
</div><!-- /#app -->

<div class="toast" id="toast"></div>

<script>
const SERVICES = [
  { name: 'Grundtjänst',     price: 250, value: 'grundtjanst'  },
  { name: 'Pro-bygge',       price: 400, value: 'pro_bygge'     },
  { name: 'Skräddarsydd PC', price: 500, value: 'skraddarsydd'  },
  { name: 'Djuprengöring',   price: 250, value: 'djuprenoring'  },
];

// ── INIT ──
(async function init() {
  const session = await checkAuth();
  if (!session) return;

  renderAdminNav('sale');
  document.getElementById('sidebar-user-email').textContent = session.user.email;
  await loadSettings();                                  // populate form BEFORE revealing UI
  document.getElementById('app').style.display = 'flex';
})();

// ── LOAD ──
async function loadSettings() {
  const { data, error } = await supabaseClient
    .from('settings')
    .select('sale_active,sale_percent,sale_title,sale_end_date,sale_applies_to')
    .eq('id', 'global')
    .single();

  if (error) {
    updateStatusUI(false);
    document.getElementById('status-desc').textContent = 'Fel vid laddning: ' + error.message;
    showToast('Kunde inte ladda inst&#228;llningar: ' + error.message, 't-red');
    renderPriceTable();
    return;
  }

  if (!data) {
    updateStatusUI(false);
    document.getElementById('status-desc').textContent = 'Ingen inst&#228;llningsrad hittades (id=global).';
    showToast('Inga inst&#228;llningar hittades — rad med id=global saknas i settings.', 't-amber');
    renderPriceTable();
    return;
  }

  const active = !!data.sale_active;
  document.getElementById('toggle-active').checked = active;
  document.getElementById('f-percent').value        = data.sale_percent  ?? '';
  document.getElementById('f-title').value          = data.sale_title    ?? '';
  document.getElementById('f-end-date').value       = data.sale_end_date ?? '';

  // sale_applies_to is now text[] — Supabase JS returns it as a JS array
  const appliesArr = Array.isArray(data.sale_applies_to) ? data.sale_applies_to : [];
  populateAppliesTo(appliesArr);

  updateStatusUI(active);
  renderPriceTable();
}

// ── TOGGLE (saves immediately) ──
async function saveToggle() {
  const active = document.getElementById('toggle-active').checked;

  const { data: rows, error } = await supabaseClient
    .from('settings')
    .update({ sale_active: active })
    .eq('id', 'global')
    .select('id');

  if (error) {
    showToast('Fel: ' + error.message, 't-red');
    document.getElementById('toggle-active').checked = !active; // revert
    return;
  }
  if (!rows || rows.length === 0) {
    showToast('Inget sparades — raden id=global saknas i settings-tabellen.', 't-red');
    document.getElementById('toggle-active').checked = !active; // revert
    return;
  }

  updateStatusUI(active);
  renderPriceTable();
  showToast(active ? 'Rea aktiverad.' : 'Rea inaktiverad.', active ? 't-green' : 't-amber');
}

// ── SAVE FORM ──
async function saveSettings() {
  const percent   = parseInt(document.getElementById('f-percent').value, 10);
  const title     = document.getElementById('f-title').value.trim();
  const endDate   = document.getElementById('f-end-date').value;
  const appliesTo = getAppliesTo(); // genuine JS array → Postgres text[] via Supabase JS

  if (!appliesTo.length) {
    showToast('Välj minst en tjänst under "Gäller för".', 't-amber');
    return;
  }
  if (isNaN(percent) || percent < 1 || percent > 99) {
    showToast('Ange en rabatt mellan 1 och 99 %.', 't-amber');
    return;
  }

  const { data: rows, error } = await supabaseClient
    .from('settings')
    .update({
      sale_percent:    percent,
      sale_title:      title     || null,
      sale_end_date:   endDate   || null,
      sale_applies_to: appliesTo,
    })
    .eq('id', 'global')
    .select('id');

  if (error) {
    showToast('Fel vid sparning: ' + error.message, 't-red');
    return;
  }
  if (!rows || rows.length === 0) {
    showToast('Inget sparades — raden id=global saknas. Skapa den i Supabase Table Editor.', 't-red');
    return;
  }

  renderPriceTable();
  showToast('Inst&#228;llningar sparade.', 't-green');

  const flash = document.getElementById('save-flash');
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 2500);
}

// ── STATUS UI ──
function updateStatusUI(active) {
  const badge = document.getElementById('status-badge');
  const desc  = document.getElementById('status-desc');
  if (active) {
    badge.className   = 'sale-status-badge on';
    badge.textContent = 'REA AKTIV';
    desc.textContent  = 'Rea visas på hemsidan för kunder.';
  } else {
    badge.className   = 'sale-status-badge off';
    badge.textContent = 'Ingen rea aktiv';
    desc.textContent  = 'Rea är dold för kunder. Aktivera för att visa.';
  }
}

// ── PRICE TABLE (live) ──
function renderPriceTable() {
  const active    = document.getElementById('toggle-active').checked;
  const percent   = parseInt(document.getElementById('f-percent').value, 10) || 0;
  const appliesTo = getAppliesTo(); // array of selected service values
  const showSale  = active && percent > 0;

  document.getElementById('sale-col-hd').style.display = showSale ? '' : 'none';

  document.getElementById('prices-tbody').innerHTML = SERVICES.map(svc => {
    const affected   = showSale && (appliesTo.includes('all') || appliesTo.includes(svc.value));
    const salePrice  = Math.round(svc.price * (1 - percent / 100));

    const nameCell   = `<td>${affected ? '<span class="applies-dot"></span>' : ''}${escH(svc.name)}</td>`;
    const origCell   = affected
      ? `<td><span class="price-strike">${svc.price} kr</span></td>`
      : `<td><span class="price-orig">${svc.price} kr</span></td>`;
    const saleCell   = showSale
      ? `<td>${affected ? `<span class="price-sale">${salePrice} kr</span>` : '<span style="color:var(--gray);font-size:0.8rem;">—</span>'}</td>`
      : '';

    return `<tr>${nameCell}${origCell}${saleCell}</tr>`;
  }).join('');
}

// ── CHECKBOX HELPERS ──

// Returns the current applies-to selection as a JS array of value strings.
// Used by both saveSettings() and renderPriceTable().
function getAppliesTo() {
  if (document.getElementById('cb-all').checked) return ['all'];
  return Array.from(document.querySelectorAll('.cb-service:checked')).map(cb => cb.value);
}

// Populates checkboxes from a stored text[] array (called on page load).
function populateAppliesTo(arr) {
  const allCb     = document.getElementById('cb-all');
  const serviceCbs = document.querySelectorAll('.cb-service');

  if (!arr.length || arr.includes('all')) {
    // "Alla tjänster" — check the all box, disable individual ones
    allCb.checked = true;
    serviceCbs.forEach(cb => { cb.checked = false; cb.disabled = true;
      cb.closest('.cb-item').classList.add('disabled'); });
  } else {
    allCb.checked = false;
    serviceCbs.forEach(cb => {
      cb.checked  = arr.includes(cb.value);
      cb.disabled = false;
      cb.closest('.cb-item').classList.remove('disabled');
    });
  }
}

// Called when "Alla tjänster" checkbox changes.
function onAllaChange() {
  const allCb     = document.getElementById('cb-all');
  const serviceCbs = document.querySelectorAll('.cb-service');
  if (allCb.checked) {
    serviceCbs.forEach(cb => { cb.checked = false; cb.disabled = true;
      cb.closest('.cb-item').classList.add('disabled'); });
  } else {
    serviceCbs.forEach(cb => { cb.disabled = false;
      cb.closest('.cb-item').classList.remove('disabled'); });
  }
  renderPriceTable();
}

// Called when any individual service checkbox changes.
function onServiceChange() {
  // Deselect "Alla" automatically if any individual service is picked
  document.getElementById('cb-all').checked = false;
  renderPriceTable();
}

function escH(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
