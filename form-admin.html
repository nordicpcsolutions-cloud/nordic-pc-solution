<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0Ij48cmVjdCB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHJ4PSIxMiIgZmlsbD0iIzBhMGYxZSIvPjx0ZXh0IHg9IjMyIiB5PSI0NyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsIEJsYWNrLHNhbnMtc2VyaWYiIGZvbnQtd2VpZ2h0PSI5MDAiIGZvbnQtc2l6ZT0iNDQiIGZpbGw9IiMxYTRmZmYiPlA8L3RleHQ+PC9zdmc+">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulär &#8211; Nordic PC Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shared.css">
<style>
/* ── PAGE ── */
.page-hd{margin-bottom:1.5rem;}
.page-hd h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.85rem;letter-spacing:0.02em;text-transform:uppercase;}

/* ── TABS ── */
.tab-bar{display:flex;gap:0.25rem;border-bottom:1px solid rgba(255,255,255,0.07);margin-bottom:1.75rem;}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;padding:0.7rem 1.2rem;color:var(--gray);font-family:'Barlow',sans-serif;font-size:0.85rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:color 0.2s,border-color 0.2s;margin-bottom:-1px;}
.tab-btn:hover{color:var(--gray-light);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ── STATUS BADGES ── */
.s-new{background:rgba(26,79,255,0.15);color:#7fa8ff;border:1px solid rgba(26,79,255,0.35);}
.s-new::before{background:#7fa8ff;}
.s-progress{background:rgba(250,180,0,0.12);color:#f0c040;border:1px solid rgba(250,180,0,0.35);}
.s-progress::before{background:#f0c040;}
.s-finished{background:rgba(15,186,104,0.1);color:#6ff0b0;border:1px solid rgba(15,186,104,0.3);}
.s-finished::before{background:#6ff0b0;}

/* ── PANEL HEADER ── */
.panel-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:0.75rem;}
.panel-hd h2{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--gray);}

/* ── DEFS TABLE ── */
.defs-table-wrap{overflow-x:auto;margin-bottom:1.5rem;}
.defs-table{width:100%;border-collapse:collapse;font-size:0.85rem;}
.defs-table th{text-align:left;font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);padding:0.55rem 1rem;border-bottom:1px solid rgba(255,255,255,0.07);}
.defs-table td{padding:0.75rem 1rem;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--gray-light);vertical-align:middle;}
.defs-table tr:last-child td{border-bottom:none;}
.defs-table tr:hover td{background:rgba(255,255,255,0.02);}
.def-key{font-family:monospace;font-size:0.82rem;background:rgba(0,212,255,0.08);color:var(--accent);padding:0.2rem 0.55rem;border-radius:4px;}
.def-actions{display:flex;gap:0.4rem;}
.btn-icon{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--gray-light);padding:0.35rem 0.75rem;border-radius:5px;font-size:0.78rem;font-weight:700;cursor:pointer;transition:border-color 0.2s,color 0.2s;white-space:nowrap;}
.btn-icon:hover{border-color:rgba(255,255,255,0.35);color:var(--white);}
.btn-icon.danger:hover{border-color:rgba(220,60,60,0.5);color:#ff9090;}

/* ── DEF EDITOR PANEL ── */
.def-editor{background:var(--dark2);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:1.8rem 2rem;margin-bottom:1.5rem;}
.def-editor h3{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.1rem;text-transform:uppercase;color:var(--accent);margin-bottom:1.4rem;}
.def-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.2rem;}
.def-field{display:flex;flex-direction:column;gap:0.38rem;}
.def-field.full{grid-column:1/-1;}
.def-field label{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);}
.def-field input,.def-field textarea,.def-field select{background:var(--dark3);border:1px solid rgba(255,255,255,0.1);border-radius:7px;padding:0.65rem 0.9rem;color:var(--white);font-family:'Barlow',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s;min-height:42px;}
.def-field input:focus,.def-field textarea:focus,.def-field select:focus{border-color:var(--blue);}
.def-field textarea{resize:vertical;min-height:72px;}
.def-field select option{background:var(--dark3);}

/* ── FIELD BUILDER ── */
.field-builder-label{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);margin-bottom:0.75rem;display:block;}
.field-rows{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:0.75rem;}
.field-row{background:var(--dark3);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:0.9rem 1rem;}
.field-row-main{display:grid;grid-template-columns:1fr 1.2fr 0.7fr auto auto auto auto;gap:0.5rem;align-items:center;}
.fr-input{background:var(--dark4);border:1px solid rgba(255,255,255,0.08);border-radius:5px;padding:0.5rem 0.7rem;color:var(--white);font-family:'Barlow',sans-serif;font-size:0.82rem;outline:none;transition:border-color 0.2s;min-height:36px;width:100%;}
.fr-input:focus{border-color:var(--blue);}
.fr-input option{background:var(--dark4);}
.fr-req{display:flex;align-items:center;gap:0.3rem;font-size:0.78rem;color:var(--gray-light);white-space:nowrap;}
.fr-req input[type=checkbox]{accent-color:var(--blue);width:14px;height:14px;cursor:pointer;}
.fr-btn{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--gray);width:30px;height:30px;border-radius:5px;cursor:pointer;font-size:0.82rem;display:flex;align-items:center;justify-content:center;transition:border-color 0.2s,color 0.2s;flex-shrink:0;}
.fr-btn:hover:not(:disabled){border-color:rgba(255,255,255,0.3);color:var(--white);}
.fr-btn:disabled{opacity:0.3;cursor:default;}
.fr-btn.danger:hover{border-color:rgba(220,60,60,0.5);color:#ff9090;}
/* Options sub-builder */
.opts-builder{margin-top:0.6rem;padding-top:0.6rem;border-top:1px solid rgba(255,255,255,0.05);}
.opts-builder-label{font-size:0.68rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray);margin-bottom:0.45rem;display:block;}
.opt-rows{display:flex;flex-direction:column;gap:0.35rem;margin-bottom:0.45rem;}
.opt-row{display:flex;gap:0.4rem;align-items:center;}
.opt-row input{flex:1;}

/* ── EDITOR FOOTER ── */
.editor-footer{display:flex;gap:0.6rem;align-items:center;padding-top:1rem;border-top:1px solid rgba(255,255,255,0.06);}

/* ── SUBMISSIONS FILTER ── */
.subs-filter{display:flex;gap:0.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem;}
.subs-filter select{background:var(--dark3);border:1px solid rgba(255,255,255,0.1);border-radius:7px;padding:0.6rem 0.9rem;color:var(--white);font-family:'Barlow',sans-serif;font-size:0.83rem;outline:none;cursor:pointer;min-height:40px;}
.subs-filter select option{background:var(--dark3);}
.result-count{font-size:0.78rem;color:var(--gray);margin-left:auto;}

/* ── SUBMISSIONS TABLE ── */
.subs-table-wrap{overflow-x:auto;}
.subs-table{width:100%;border-collapse:collapse;font-size:0.85rem;}
.subs-table th{text-align:left;font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);padding:0.55rem 1rem;border-bottom:1px solid rgba(255,255,255,0.07);}
.subs-table td{padding:0.72rem 1rem;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--gray-light);vertical-align:middle;}
.subs-table tr:last-child td{border-bottom:none;}
.subs-table tr:hover td{background:rgba(255,255,255,0.02);cursor:pointer;}
.sub-preview{font-size:0.8rem;color:var(--gray);}
.sub-date{font-size:0.8rem;white-space:nowrap;}

/* ── DETAIL MODAL ── */
.detail-modal .modal-card{max-width:620px;max-height:85vh;overflow-y:auto;}
.detail-data-list{margin-bottom:1.25rem;}
.detail-row{padding:0.55rem 0;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;gap:1rem;}
.detail-row:last-child{border-bottom:none;}
.detail-row-lbl{font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray);min-width:150px;flex-shrink:0;padding-top:0.15rem;}
.detail-row-val{font-size:0.87rem;color:var(--gray-light);line-height:1.55;word-break:break-word;flex:1;}
.detail-meta{font-size:0.78rem;color:var(--gray);margin-bottom:1.2rem;display:flex;flex-wrap:wrap;gap:0.4rem 1.5rem;}
.detail-status-row{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1.2rem;}
.status-action-btn{background:transparent;border:1px solid rgba(255,255,255,0.12);color:var(--gray-light);padding:0.45rem 1rem;border-radius:5px;font-family:'Barlow',sans-serif;font-size:0.78rem;font-weight:700;cursor:pointer;transition:border-color 0.2s,color 0.2s;white-space:nowrap;}
.status-action-btn:hover:not(:disabled){border-color:rgba(255,255,255,0.35);color:var(--white);}
.status-action-btn:disabled{opacity:0.35;cursor:default;}
.notes-label{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);display:block;margin-bottom:0.4rem;}
.notes-textarea{width:100%;background:var(--dark3);border:1px solid rgba(255,255,255,0.1);border-radius:7px;padding:0.65rem 0.9rem;color:var(--white);font-family:'Barlow',sans-serif;font-size:0.85rem;resize:vertical;min-height:80px;outline:none;transition:border-color 0.2s;}
.notes-textarea:focus{border-color:var(--blue);}
.detail-footer{display:flex;gap:0.6rem;padding-top:1.1rem;border-top:1px solid rgba(255,255,255,0.06);flex-wrap:wrap;justify-content:space-between;}

@media(max-width:760px){
  .field-row-main{grid-template-columns:1fr 1fr;gap:0.4rem;}
  .def-grid{grid-template-columns:1fr;}
  .def-field.full{grid-column:1;}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="admin-shared.js"></script>
</head>
<body>

<div id="app" style="display:none;">

  <div id="admin-nav"></div>

  <main class="admin-main">

    <div class="page-hd">
      <h1>Formulär</h1>
    </div>

    <!-- TABS -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-defs" onclick="switchTab('defs')">Formulärmallar</button>
      <button class="tab-btn"        id="tab-subs" onclick="switchTab('subs')">Inskickade formulär <span id="subs-badge" style="display:none;background:var(--blue);color:#fff;font-size:0.65rem;padding:0.1rem 0.4rem;border-radius:10px;margin-left:0.3rem;"></span></button>
    </div>

    <!-- ══════════════════════════════
         DEFINITIONS TAB
    ══════════════════════════════ -->
    <div id="panel-defs">
      <div class="panel-hd">
        <h2>Mallar</h2>
        <button class="btn-primary" onclick="openDefEditor()">+ Ny mall</button>
      </div>

      <!-- Editor panel (hidden by default) -->
      <div class="def-editor" id="def-editor" style="display:none;">
        <h3 id="editor-title">Ny formulärmall</h3>

        <div class="def-grid">
          <div class="def-field">
            <label for="def-key">Nyckel (key) <span style="color:var(--accent)">*</span></label>
            <input type="text" id="def-key" placeholder="t.ex. pc_analysis" oninput="enforceKeyFormat(this)">
          </div>
          <div class="def-field">
            <label for="def-title">Modal-titel <span style="color:var(--accent)">*</span></label>
            <input type="text" id="def-title" placeholder="Gratis PC-analys">
          </div>
          <div class="def-field full">
            <label for="def-subtitle">Undertitel (valfritt)</label>
            <input type="text" id="def-subtitle" placeholder="Kort beskrivning under titeln">
          </div>
          <div class="def-field">
            <label for="def-btn-text">Skicka-knapptext</label>
            <input type="text" id="def-btn-text" placeholder="Skicka">
          </div>
          <div class="def-field full">
            <label for="def-success">Framg&#229;ngsmeddelande</label>
            <textarea id="def-success" placeholder="Tack! Vi &#229;terkommer inom kort."></textarea>
          </div>
        </div>

        <!-- Field builder -->
        <span class="field-builder-label">F&#228;lt</span>
        <div id="field-rows" class="field-rows"></div>
        <button class="btn-secondary" style="font-size:0.8rem;padding:0.45rem 1rem;min-height:unset;" onclick="addField()">+ L&#228;gg till f&#228;lt</button>

        <div class="editor-footer">
          <button class="btn-primary" id="def-save-btn" onclick="saveDef()">Spara</button>
          <button class="btn-secondary" onclick="closeDefEditor()">Avbryt</button>
          <span class="save-flash" id="def-save-flash" style="display:none;font-size:0.8rem;color:#6ff0b0;font-weight:700;">&#10003; Sparat</span>
        </div>
      </div>

      <!-- Definitions list -->
      <div class="defs-table-wrap" id="defs-list">
        <p style="color:var(--gray);font-size:0.88rem;">Laddar&#8230;</p>
      </div>
    </div>

    <!-- ══════════════════════════════
         SUBMISSIONS TAB
    ══════════════════════════════ -->
    <div id="panel-subs" style="display:none;">
      <div class="subs-filter">
        <select id="filter-form-key" onchange="renderSubsTable()">
          <option value="">Alla formulär</option>
        </select>
        <select id="filter-status" onchange="renderSubsTable()">
          <option value="">Alla statusar</option>
          <option value="new">Nya</option>
          <option value="progress">P&#229;g&#229;ende</option>
          <option value="finished">Avslutade</option>
        </select>
        <button class="btn-secondary" style="font-size:0.8rem;padding:0.45rem 1rem;min-height:unset;" onclick="loadSubmissions()">&#8635; Uppdatera</button>
        <span class="result-count" id="subs-count"></span>
      </div>
      <div class="subs-table-wrap" id="subs-list">
        <p style="color:var(--gray);font-size:0.88rem;">Laddar&#8230;</p>
      </div>
    </div>

  </main>
</div>

<!-- SUBMISSION DETAIL MODAL -->
<div class="modal-overlay detail-modal" id="sub-detail-modal">
  <div class="modal-card" id="sub-detail-card">
    <!-- populated dynamically -->
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════
var allDefs        = [];   // form_definitions rows
var allSubs        = [];   // form_submissions rows
var editingDefId   = null; // null = create, string = edit
var defFields      = [];   // current field array in the editor
var currentSubId   = null; // submission id shown in detail modal

// ════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════
(async function init() {
  var session = await checkAuth();
  if (!session) return;
  renderAdminNav('forms');
  document.getElementById('sidebar-user-email').textContent = session.user.email;
  document.getElementById('app').style.display = 'flex';
  await Promise.all([loadDefs(), loadSubmissions()]);
})();

// ════════════════════════════════════════════════════════════════════
// TABS
// ════════════════════════════════════════════════════════════════════
var _currentTab = 'defs';

function switchTab(tab) {
  _currentTab = tab;
  document.getElementById('panel-defs').style.display = tab === 'defs' ? '' : 'none';
  document.getElementById('panel-subs').style.display = tab === 'subs' ? '' : 'none';
  document.getElementById('tab-defs').classList.toggle('active', tab === 'defs');
  document.getElementById('tab-subs').classList.toggle('active', tab === 'subs');
}

// ════════════════════════════════════════════════════════════════════
// FORM DEFINITIONS — LOAD + RENDER
// ════════════════════════════════════════════════════════════════════
async function loadDefs() {
  var { data, error } = await supabaseClient.from('form_definitions').select('*').order('created_at', { ascending: true });
  if (error) { showToast('Fel vid laddning av mallar.', 't-red'); return; }
  allDefs = data || [];
  renderDefsList();
  populateFormKeyFilter();
}

function renderDefsList() {
  var wrap = document.getElementById('defs-list');
  if (!allDefs.length) {
    wrap.innerHTML = '<p style="color:var(--gray);font-size:0.88rem;padding:1rem 0;">Inga formulärmallar ännu. Skapa den första ovan.</p>';
    return;
  }
  var rows = allDefs.map(function(d) {
    var fieldCount = Array.isArray(d.fields) ? d.fields.length : 0;
    return '<tr>' +
      '<td><span class="def-key">' + escH(d.key) + '</span></td>' +
      '<td>' + escH(d.modal_title || '—') + '</td>' +
      '<td style="color:var(--gray);">' + fieldCount + ' fält</td>' +
      '<td><div class="def-actions">' +
        '<button class="btn-icon" onclick="editDef(' + JSON.stringify(d.id) + ')">Redigera</button>' +
        '<button class="btn-icon danger" onclick="deleteDef(' + JSON.stringify(d.id) + ', ' + JSON.stringify(d.key) + ')">Radera</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');

  wrap.innerHTML = '<table class="defs-table">' +
    '<thead><tr><th>Nyckel</th><th>Titel</th><th>F&#228;lt</th><th>&#197;tg&#228;rder</th></tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
  '</table>';
}

// ════════════════════════════════════════════════════════════════════
// FORM DEFINITIONS — EDITOR
// ════════════════════════════════════════════════════════════════════
function openDefEditor(def) {
  editingDefId = def ? def.id : null;
  defFields    = def && Array.isArray(def.fields) ? JSON.parse(JSON.stringify(def.fields)) : [];

  document.getElementById('editor-title').textContent = def ? 'Redigera mall' : 'Ny formulärmall';
  document.getElementById('def-key').value     = def ? (def.key               || '') : '';
  document.getElementById('def-title').value   = def ? (def.modal_title       || '') : '';
  document.getElementById('def-subtitle').value= def ? (def.modal_subtitle    || '') : '';
  document.getElementById('def-btn-text').value= def ? (def.submit_button_text|| '') : '';
  document.getElementById('def-success').value = def ? (def.success_message   || '') : '';
  document.getElementById('def-key').readOnly  = !!def; // prevent changing key after creation

  document.getElementById('def-editor').style.display = '';
  renderFieldRows();
  document.getElementById('def-key').focus();
  document.getElementById('def-editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeDefEditor() {
  document.getElementById('def-editor').style.display = 'none';
  editingDefId = null;
  defFields    = [];
}

function editDef(id) {
  var def = allDefs.find(function(d) { return d.id === id; });
  if (def) openDefEditor(def);
}

function enforceKeyFormat(input) {
  input.value = input.value.toLowerCase().replace(/[^a-z0-9_]/g, '_');
}

// ── FIELD ROWS ────────────────────────────────────────────────────
function renderFieldRows() {
  var container = document.getElementById('field-rows');
  if (!defFields.length) {
    container.innerHTML = '<p style="color:var(--gray);font-size:0.82rem;padding:0.5rem 0;">Inga fält ännu.</p>';
    return;
  }
  container.innerHTML = defFields.map(function(f, i) {
    var isSelect = f.type === 'select';
    var mainRow =
      '<div class="field-row" id="frow-' + i + '">' +
        '<div class="field-row-main">' +
          '<input class="fr-input" type="text" placeholder="fältnamn" value="' + escH(f.name || '') + '" oninput="defFields[' + i + '].name=this.value">' +
          '<input class="fr-input" type="text" placeholder="Etikett" value="' + escH(f.label || '') + '" oninput="defFields[' + i + '].label=this.value">' +
          '<select class="fr-input" onchange="changeFieldType(' + i + ',this.value)">' +
            ['text','email','tel','textarea','select'].map(function(t) {
              return '<option value="' + t + '"' + (f.type === t ? ' selected' : '') + '>' + t + '</option>';
            }).join('') +
          '</select>' +
          '<label class="fr-req"><input type="checkbox"' + (f.required ? ' checked' : '') + ' onchange="defFields[' + i + '].required=this.checked"> Obl.</label>' +
          '<button class="fr-btn" onclick="moveField(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + ' title="Flytta upp">&#8593;</button>' +
          '<button class="fr-btn" onclick="moveField(' + i + ',1)"' + (i === defFields.length-1 ? ' disabled' : '') + ' title="Flytta ner">&#8595;</button>' +
          '<button class="fr-btn danger" onclick="removeField(' + i + ')" title="Ta bort">&#x2715;</button>' +
        '</div>' +
        (isSelect ? renderOptsBuilder(i) : '') +
      '</div>';
    return mainRow;
  }).join('');
}

function renderOptsBuilder(fieldIdx) {
  var opts = defFields[fieldIdx].options || [];
  var rows = opts.map(function(o, oi) {
    return '<div class="opt-row">' +
      '<input class="fr-input" type="text" placeholder="Alternativ" value="' + escH(o) + '" oninput="defFields[' + fieldIdx + '].options[' + oi + ']=this.value">' +
      '<button class="fr-btn danger" onclick="removeOption(' + fieldIdx + ',' + oi + ')" title="Ta bort">&#x2715;</button>' +
    '</div>';
  }).join('');
  return '<div class="opts-builder">' +
    '<span class="opts-builder-label">Alternativ</span>' +
    '<div class="opt-rows" id="opt-rows-' + fieldIdx + '">' + rows + '</div>' +
    '<button class="btn-secondary" style="font-size:0.75rem;padding:0.3rem 0.7rem;min-height:unset;" onclick="addOption(' + fieldIdx + ')">+ Alternativ</button>' +
  '</div>';
}

function changeFieldType(idx, type) {
  defFields[idx].type = type;
  if (type === 'select' && !defFields[idx].options) defFields[idx].options = [];
  renderFieldRows();
}

function addField() {
  defFields.push({ name: '', label: '', type: 'text', required: false });
  renderFieldRows();
}

function removeField(idx) {
  defFields.splice(idx, 1);
  renderFieldRows();
}

function moveField(idx, dir) {
  var swap = idx + dir;
  if (swap < 0 || swap >= defFields.length) return;
  var tmp       = defFields[idx];
  defFields[idx] = defFields[swap];
  defFields[swap] = tmp;
  renderFieldRows();
}

function addOption(fieldIdx) {
  if (!defFields[fieldIdx].options) defFields[fieldIdx].options = [];
  defFields[fieldIdx].options.push('');
  renderFieldRows();
}

function removeOption(fieldIdx, optIdx) {
  defFields[fieldIdx].options.splice(optIdx, 1);
  renderFieldRows();
}

// ── SAVE DEF ─────────────────────────────────────────────────────
async function saveDef() {
  var key        = document.getElementById('def-key').value.trim();
  var title      = document.getElementById('def-title').value.trim();
  var subtitle   = document.getElementById('def-subtitle').value.trim();
  var btnText    = document.getElementById('def-btn-text').value.trim();
  var successMsg = document.getElementById('def-success').value.trim();

  if (!key)   { showToast('Nyckel krävs.', 't-amber');  return; }
  if (!title) { showToast('Titel krävs.', 't-amber');   return; }

  var btn = document.getElementById('def-save-btn');
  btn.disabled = true;
  btn.textContent = 'Sparar…';

  var payload = {
    key:                 key,
    modal_title:         title,
    modal_subtitle:      subtitle   || null,
    submit_button_text:  btnText    || 'Skicka',
    success_message:     successMsg || null,
    fields:              defFields,
  };

  var { error } = editingDefId
    ? await supabaseClient.from('form_definitions').update(payload).eq('id', editingDefId)
    : await supabaseClient.from('form_definitions').insert(payload);

  btn.disabled = false;
  btn.textContent = 'Spara';

  if (error) {
    showToast('Fel: ' + error.message, 't-red');
    return;
  }

  showToast('Sparad!', 't-green');
  var flash = document.getElementById('def-save-flash');
  if (flash) { flash.style.display = ''; setTimeout(function() { flash.style.display = 'none'; }, 2500); }

  closeDefEditor();
  await loadDefs();
}

async function deleteDef(id, key) {
  if (!confirm('Radera mallen "' + key + '"? Detta raderar inte inskickade svar.')) return;
  var { error } = await supabaseClient.from('form_definitions').delete().eq('id', id);
  if (error) { showToast('Fel vid radering.', 't-red'); return; }
  showToast('Mall raderad.', 't-green');
  await loadDefs();
}

// ════════════════════════════════════════════════════════════════════
// SUBMISSIONS — LOAD + RENDER
// ════════════════════════════════════════════════════════════════════
async function loadSubmissions() {
  var { data, error } = await supabaseClient
    .from('form_submissions')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) { showToast('Fel vid laddning av svar.', 't-red'); return; }
  allSubs = data || [];

  // Update new-subs badge on tab
  var newCount = allSubs.filter(function(s) { return s.status === 'new' || !s.status; }).length;
  var badge    = document.getElementById('subs-badge');
  if (newCount > 0) {
    badge.textContent = String(newCount);
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }

  renderSubsTable();
}

function populateFormKeyFilter() {
  var sel    = document.getElementById('filter-form-key');
  var cur    = sel.value;
  var keys   = allDefs.map(function(d) { return { key: d.key, title: d.modal_title }; });
  sel.innerHTML = '<option value="">Alla formulär</option>' +
    keys.map(function(k) {
      return '<option value="' + escH(k.key) + '"' + (cur === k.key ? ' selected' : '') + '>' +
        escH(k.title || k.key) + '</option>';
    }).join('');
}

function renderSubsTable() {
  var wrap      = document.getElementById('subs-list');
  var keyFilter = document.getElementById('filter-form-key').value;
  var statFilter= document.getElementById('filter-status').value;

  var filtered = allSubs.filter(function(s) {
    if (keyFilter  && s.form_key !== keyFilter) return false;
    if (statFilter && (s.status || 'new') !== statFilter) return false;
    return true;
  });

  document.getElementById('subs-count').textContent = filtered.length + ' svar';

  if (!filtered.length) {
    wrap.innerHTML = '<p style="color:var(--gray);font-size:0.88rem;padding:1rem 0;">Inga svar matchar filtret.</p>';
    return;
  }

  var STATUS_BADGE = {
    new:      '<span class="status-badge s-new">Ny</span>',
    progress: '<span class="status-badge s-progress">P&#229;g&#229;ende</span>',
    finished: '<span class="status-badge s-finished">Avslutad</span>',
  };

  var rows = filtered.map(function(s) {
    var def        = allDefs.find(function(d) { return d.key === s.form_key; });
    var formLabel  = def ? escH(def.modal_title) : '<span class="def-key">' + escH(s.form_key) + '</span>';
    var status     = s.status || 'new';
    var badge      = STATUS_BADGE[status] || escH(status);
    var preview    = buildDataPreview(s.data, def);
    var date       = formatDate(s.created_at);

    return '<tr onclick="openSubDetail(' + JSON.stringify(s.id) + ')">' +
      '<td>' + formLabel + '</td>' +
      '<td><span class="sub-preview">' + escH(preview) + '</span></td>' +
      '<td><span class="sub-date">' + date + '</span></td>' +
      '<td>' + badge + '</td>' +
    '</tr>';
  }).join('');

  wrap.innerHTML = '<table class="subs-table">' +
    '<thead><tr><th>Formulär</th><th>Sammanfattning</th><th>Datum</th><th>Status</th></tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
  '</table>';
}

function buildDataPreview(data, def) {
  if (!data || typeof data !== 'object') return '—';
  // Show name + email if present, otherwise first two populated values
  var parts = [];
  if (data.name)  parts.push(data.name);
  if (data.email) parts.push(data.email);
  if (parts.length === 0) {
    Object.keys(data).slice(0, 2).forEach(function(k) {
      if (data[k]) parts.push(String(data[k]).slice(0, 40));
    });
  }
  return parts.join(' · ') || '—';
}

// ════════════════════════════════════════════════════════════════════
// SUBMISSION DETAIL MODAL
// ════════════════════════════════════════════════════════════════════
function openSubDetail(id) {
  var sub = allSubs.find(function(s) { return s.id === id; });
  if (!sub) return;
  currentSubId = id;
  var def = allDefs.find(function(d) { return d.key === sub.form_key; });
  renderSubDetail(sub, def);
  document.getElementById('sub-detail-modal').classList.add('open');
}

function closeSubDetail() {
  document.getElementById('sub-detail-modal').classList.remove('open');
  currentSubId = null;
}

function renderSubDetail(sub, def) {
  var status    = sub.status || 'new';
  var data      = sub.data || {};
  var fields    = def && Array.isArray(def.fields) ? def.fields : [];
  var formTitle = def ? def.modal_title : sub.form_key;

  var STATUS_BADGE = {
    new:      '<span class="status-badge s-new">Ny</span>',
    progress: '<span class="status-badge s-progress">P&#229;g&#229;ende</span>',
    finished: '<span class="status-badge s-finished">Avslutad</span>',
  };

  // Build data rows using field labels where available
  var labelMap = {};
  fields.forEach(function(f) { labelMap[f.name] = f.label; });

  var dataRows = Object.keys(data).map(function(key) {
    var lbl = labelMap[key] || key;
    var val = data[key];
    if (!val && val !== 0) return '';
    return '<div class="detail-row">' +
      '<span class="detail-row-lbl">' + escH(lbl) + '</span>' +
      '<span class="detail-row-val">' + escH(String(val)) + '</span>' +
    '</div>';
  }).filter(Boolean).join('');

  var card = document.getElementById('sub-detail-card');
  card.innerHTML =
    '<button class="modal-close" onclick="closeSubDetail()" aria-label="St&#228;ng">&#x2715;</button>' +
    '<h3>' + escH(formTitle) + '</h3>' +
    '<div class="detail-meta">' +
      '<span>' + STATUS_BADGE[status] + '</span>' +
      '<span>Inkommen: ' + formatDate(sub.created_at) + '</span>' +
      (sub.source_page ? '<span>Sida: ' + escH(sub.source_page) + '</span>' : '') +
    '</div>' +
    '<div class="detail-data-list">' + (dataRows || '<p style="color:var(--gray);font-size:0.85rem;">Ingen data.</p>') + '</div>' +
    '<div class="detail-status-row">' +
      '<span style="font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray);margin-right:0.3rem;">Status:</span>' +
      '<button class="status-action-btn" onclick="setSubStatus(\'new\')"' +      (status === 'new'      ? ' disabled' : '') + '>Ny</button>' +
      '<button class="status-action-btn" onclick="setSubStatus(\'progress\')"' + (status === 'progress' ? ' disabled' : '') + '>P&#229;g&#229;ende</button>' +
      '<button class="status-action-btn" onclick="setSubStatus(\'finished\')"' + (status === 'finished' ? ' disabled' : '') + '>Avslutad</button>' +
    '</div>' +
    '<label class="notes-label" for="sub-notes">Interna anteckningar</label>' +
    '<textarea class="notes-textarea" id="sub-notes">' + escH(sub.internal_notes || '') + '</textarea>' +
    '<div class="detail-footer">' +
      '<div style="display:flex;gap:0.5rem;">' +
        '<button class="btn-primary" style="font-size:0.82rem;padding:0.55rem 1.2rem;min-height:unset;" onclick="saveSubNotes()">Spara anteckningar</button>' +
        '<button class="btn-secondary" style="font-size:0.82rem;padding:0.55rem 1rem;min-height:unset;" onclick="closeSubDetail()">St&#228;ng</button>' +
      '</div>' +
      '<button class="btn-icon danger" style="margin-left:auto;" onclick="deleteSub(' + JSON.stringify(sub.id) + ')">Radera</button>' +
    '</div>';
}

async function setSubStatus(newStatus) {
  if (!currentSubId) return;
  var { error } = await supabaseClient
    .from('form_submissions')
    .update({ status: newStatus })
    .eq('id', currentSubId);

  if (error) { showToast('Fel vid statusändring.', 't-red'); return; }

  var sub = allSubs.find(function(s) { return s.id === currentSubId; });
  if (sub) sub.status = newStatus;
  var def = allDefs.find(function(d) { return d.key === sub.form_key; });
  renderSubDetail(sub, def);
  renderSubsTable();
  showToast('Status uppdaterad.', 't-green');
}

async function saveSubNotes() {
  if (!currentSubId) return;
  var notes = document.getElementById('sub-notes').value;
  var { error } = await supabaseClient
    .from('form_submissions')
    .update({ internal_notes: notes })
    .eq('id', currentSubId);

  if (error) { showToast('Fel vid sparning.', 't-red'); return; }

  var sub = allSubs.find(function(s) { return s.id === currentSubId; });
  if (sub) sub.internal_notes = notes;
  showToast('Anteckningar sparade.', 't-green');
}

async function deleteSub(id) {
  if (!confirm('Radera detta svar? Åtgärden kan inte ångras.')) return;
  var { error } = await supabaseClient.from('form_submissions').delete().eq('id', id);
  if (error) { showToast('Fel vid radering.', 't-red'); return; }
  allSubs = allSubs.filter(function(s) { return s.id !== id; });
  closeSubDetail();
  renderSubsTable();
  showToast('Svar raderat.', 't-green');
}

// ════════════════════════════════════════════════════════════════════
// UTILITIES
// ════════════════════════════════════════════════════════════════════
function escH(str) {
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Close detail modal on click outside
document.getElementById('sub-detail-modal').addEventListener('click', function(e) {
  if (e.target === this) closeSubDetail();
});
</script>
