<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0Ij48cmVjdCB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHJ4PSIxMiIgZmlsbD0iIzBhMGYxZSIvPjx0ZXh0IHg9IjMyIiB5PSI0NyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsIEJsYWNrLHNhbnMtc2VyaWYiIGZvbnQtd2VpZ2h0PSI5MDAiIGZvbnQtc2l6ZT0iNDQiIGZpbGw9IiMxYTRmZmYiPlA8L3RleHQ+PC9zdmc+">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artikel &#8211; Nordic PC Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">

<!-- CSS load order: base theme first, then EasyMDE, then local overrides -->
<link rel="stylesheet" href="admin-shared.css">
<link rel="stylesheet" href="article-typography.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">

<style>
/* ── Editor layout ── */
.editor-header{display:flex;align-items:center;gap:0.85rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.editor-header h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;text-transform:uppercase;letter-spacing:0.02em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
a.btn-back{display:inline-flex;align-items:center;gap:0.35rem;text-decoration:none;flex-shrink:0;}
.editor-cols{display:grid;grid-template-columns:1fr 300px;gap:1.25rem;align-items:start;}
.editor-main{display:flex;flex-direction:column;gap:0.75rem;min-width:0;}
.editor-sidebar{display:flex;flex-direction:column;gap:0.75rem;position:sticky;top:1rem;}

/* ── Title ── */
.title-input{width:100%;box-sizing:border-box;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.55rem;letter-spacing:0.02em;background:var(--dark3);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:var(--white);padding:0.65rem 0.9rem;outline:none;transition:border-color 0.2s;}
.title-input:focus{border-color:var(--blue);}
.title-input::placeholder{color:var(--gray);font-weight:600;}

/* ── Slug ── */
.slug-row{display:flex;align-items:center;gap:0.45rem;background:var(--dark3);border:1px solid rgba(255,255,255,0.08);border-radius:7px;padding:0.38rem 0.7rem;}
.slug-prefix{font-size:0.76rem;color:var(--gray);font-family:monospace;white-space:nowrap;}
.slug-row input{flex:1;min-width:0;background:transparent;border:none;color:var(--gray-light);font-family:monospace;font-size:0.78rem;outline:none;}
.slug-row input:focus{color:var(--white);}
.btn-regen{background:var(--dark4);border:1px solid rgba(255,255,255,0.1);color:var(--gray);border-radius:4px;padding:0.18rem 0.5rem;font-size:0.7rem;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;white-space:nowrap;transition:color 0.15s,border-color 0.15s;}
.btn-regen:hover{color:var(--white);border-color:rgba(255,255,255,0.3);}

/* ── Hero image ── */
.hero-section{background:var(--dark2);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:1rem 1.1rem;}
.hero-label{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);margin-bottom:0.75rem;}
.hero-row{display:flex;align-items:flex-start;gap:0.9rem;flex-wrap:wrap;}
.hero-thumb{width:130px;height:82px;object-fit:cover;border-radius:6px;border:1px solid rgba(255,255,255,0.1);flex-shrink:0;display:none;}
.hero-placeholder{width:130px;height:82px;background:var(--dark3);border:2px dashed rgba(255,255,255,0.1);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:1.6rem;flex-shrink:0;}
.hero-actions{display:flex;flex-direction:column;gap:0.4rem;}
.hero-url-note{font-size:0.68rem;color:var(--gray);font-family:monospace;word-break:break-all;max-width:240px;margin-top:0.3rem;line-height:1.45;}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--gray);border-radius:5px;padding:0.35rem 0.7rem;font-size:0.78rem;cursor:pointer;font-family:'Barlow',sans-serif;transition:color 0.15s,border-color 0.15s;}
.btn-ghost:hover{color:var(--red);border-color:var(--red);}

/* ── Live stats ── */
.editor-stats{font-size:0.75rem;color:var(--gray);padding:0.35rem 0;}

/* ── Sidebar cards ── */
.sidebar-card{background:var(--dark2);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:1rem 1.1rem;}
.sidebar-card h3{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);margin:0 0 0.85rem 0;}
.placeholder-note{font-size:0.78rem;color:var(--gray);margin:0;font-style:italic;}
.field-hint{font-size:0.69rem;color:var(--gray);display:block;text-align:right;margin-top:0.15rem;}

/* ── EasyMDE dark theme overrides ── */
.EasyMDEContainer{border:1px solid rgba(255,255,255,0.1) !important;border-radius:8px !important;overflow:hidden;}
.EasyMDEContainer .editor-toolbar{background:var(--dark2) !important;border-bottom:1px solid rgba(255,255,255,0.08) !important;border-top:none;padding:4px 6px;}
.EasyMDEContainer .editor-toolbar button{color:var(--gray-light) !important;background:transparent !important;border:none;border-radius:4px;}
.EasyMDEContainer .editor-toolbar button:hover,
.EasyMDEContainer .editor-toolbar button.active{background:var(--dark3) !important;color:var(--white) !important;}
.EasyMDEContainer .editor-toolbar i.separator{border-color:rgba(255,255,255,0.12) !important;}
.EasyMDEContainer .CodeMirror{background:var(--dark3) !important;color:var(--gray-light) !important;border:none !important;font-size:0.9rem;line-height:1.72;padding:1rem 1.1rem;min-height:380px;}
.EasyMDEContainer .CodeMirror-scroll{min-height:380px;}
.EasyMDEContainer .CodeMirror-cursor{border-left-color:var(--white) !important;}
.EasyMDEContainer .CodeMirror-selected,
.EasyMDEContainer .CodeMirror-focused .CodeMirror-selected{background:rgba(26,79,255,0.3) !important;}
.EasyMDEContainer .CodeMirror-line span.cm-header{color:var(--white) !important;font-weight:700;}
.EasyMDEContainer .CodeMirror-line span.cm-strong{color:var(--white) !important;}
.EasyMDEContainer .CodeMirror-line span.cm-link,
.EasyMDEContainer .CodeMirror-line span.cm-url{color:#7aa5ff !important;}
.EasyMDEContainer .CodeMirror-line span.cm-quote{color:var(--gray) !important;}
.EasyMDEContainer .CodeMirror-line span.cm-code{color:var(--accent) !important;}
.EasyMDEContainer .editor-preview,
.EasyMDEContainer .editor-preview-side{background:var(--dark2) !important;color:var(--gray-light) !important;border-left:1px solid rgba(255,255,255,0.08) !important;padding:1.25rem 1.5rem;}
.EasyMDEContainer .editor-statusbar{background:var(--dark2) !important;border-top:1px solid rgba(255,255,255,0.08) !important;color:var(--gray) !important;padding:0.35rem 0.9rem;}

@media(max-width:900px){.editor-cols{grid-template-columns:1fr;}.editor-sidebar{position:static;}}
@media(max-width:540px){.editor-header h1{font-size:1.25rem;}}

/* ── Category field ── */
.cat-row{display:flex;gap:0.4rem;align-items:center;}
.cat-row select{flex:1;min-width:0;}
.btn-new-cat{background:var(--dark4);border:1px solid rgba(255,255,255,0.1);color:var(--gray-light);border-radius:5px;padding:0.35rem 0.55rem;font-size:0.73rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Barlow',sans-serif;flex-shrink:0;transition:color 0.15s,border-color 0.15s;}
.btn-new-cat:hover{color:var(--white);border-color:rgba(255,255,255,0.3);}
.new-cat-row{display:none;gap:0.3rem;align-items:center;margin-top:0.45rem;}
.new-cat-row input{flex:1;min-width:0;background:var(--dark3);border:1px solid rgba(255,255,255,0.1);border-radius:5px;color:var(--white);font-family:'Barlow',sans-serif;font-size:0.82rem;padding:0.35rem 0.6rem;outline:none;transition:border-color 0.2s;}
.new-cat-row input:focus{border-color:var(--blue);}
.btn-create-cat{background:var(--blue);border:none;color:#fff;font-family:'Barlow',sans-serif;font-size:0.73rem;font-weight:700;padding:0.35rem 0.6rem;border-radius:5px;cursor:pointer;white-space:nowrap;transition:background 0.2s;flex-shrink:0;}
.btn-create-cat:hover{background:var(--blue-light);}
.btn-cancel-cat{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--gray);border-radius:5px;padding:0.35rem 0.45rem;font-size:0.82rem;cursor:pointer;line-height:1;flex-shrink:0;transition:color 0.15s;}
.btn-cancel-cat:hover{color:var(--white);}

/* ── Tag chips + autocomplete ── */
.tag-input-wrap{position:relative;}
.tag-chips{display:flex;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.4rem;}
.tag-chips:empty{margin-bottom:0;}
.tag-chip{display:inline-flex;align-items:center;gap:0.22rem;background:rgba(26,79,255,0.18);border:1px solid rgba(26,79,255,0.4);border-radius:20px;padding:0.16rem 0.5rem 0.16rem 0.62rem;font-size:0.73rem;font-weight:600;color:var(--gray-light);}
.tag-chip-remove{background:none;border:none;color:var(--gray);cursor:pointer;font-size:0.9rem;line-height:1;padding:0;margin:0;display:inline-flex;align-items:center;transition:color 0.15s;}
.tag-chip-remove:hover{color:var(--red);}
#tag-input{width:100%;box-sizing:border-box;}
.tag-dropdown{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--dark2);border:1px solid rgba(255,255,255,0.12);border-radius:7px;box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:200;max-height:180px;overflow-y:auto;}
.tag-dd-item{padding:0.48rem 0.8rem;font-size:0.82rem;color:var(--gray-light);cursor:pointer;transition:background 0.12s;}
.tag-dd-item:hover{background:rgba(255,255,255,0.06);color:var(--white);}
.tag-dd-create{color:var(--accent);font-style:italic;}

/* ── Related articles picker ── */
.related-chips{display:flex;flex-direction:column;gap:0.3rem;margin-bottom:0.45rem;}
.related-chips:empty{margin-bottom:0;}
.related-chip{display:flex;align-items:center;gap:0.22rem;background:var(--dark3);border:1px solid rgba(255,255,255,0.09);border-radius:6px;padding:0.28rem 0.35rem 0.28rem 0.6rem;font-size:0.79rem;color:var(--gray-light);}
.related-chip-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.related-chip-move{background:none;border:1px solid rgba(255,255,255,0.1);color:var(--gray);border-radius:3px;cursor:pointer;font-size:0.6rem;line-height:1;padding:0.1rem 0.2rem;flex-shrink:0;transition:color 0.12s,border-color 0.12s;}
.related-chip-move:hover:not(:disabled){color:var(--white);border-color:rgba(255,255,255,0.3);}
.related-chip-move:disabled{opacity:0.28;cursor:default;}
.related-chip-remove{background:none;border:none;color:var(--gray);cursor:pointer;font-size:0.9rem;line-height:1;padding:0;margin-left:0.12rem;display:inline-flex;align-items:center;flex-shrink:0;transition:color 0.15s;}
.related-chip-remove:hover{color:var(--red);}
.related-input-wrap{position:relative;}
.related-dropdown{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--dark2);border:1px solid rgba(255,255,255,0.12);border-radius:7px;box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:200;max-height:200px;overflow-y:auto;}
.related-dd-item{padding:0.48rem 0.8rem;font-size:0.82rem;color:var(--gray-light);cursor:pointer;transition:background 0.12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.related-dd-item:hover{background:rgba(255,255,255,0.06);color:var(--white);}
</style>

<!-- Script load order: Supabase → marked → DOMPurify → admin-shared → markdown-renderer → content-block-renderer → EasyMDE → media-picker -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="admin-shared.js"></script>
<script src="markdown-renderer.js"></script>
<script src="content-block-renderer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
<script src="media-picker.js"></script>
</head>
<body>

<div id="app" style="display:none;">
  <div id="admin-nav"></div>

  <main class="admin-main">

    <!-- ── PAGE HEADER ── -->
    <div class="editor-header">
      <a class="btn-secondary btn-back" href="blog-admin.html">&#8592; Artiklar</a>
      <h1 id="page-title">Ny artikel</h1>
      <div>
        <button class="btn-primary" onclick="savePost()">Spara</button>
      </div>
    </div>

    <div class="editor-cols">

      <!-- ══════════════════════════════════════
           LEFT COLUMN — main content area
      ══════════════════════════════════════ -->
      <div class="editor-main">

        <!-- Title — auto-generates slug via slugify() from admin-shared.js
             unless the admin has manually edited the slug field -->
        <input class="title-input" id="f-title" type="text"
               placeholder="Artikelns rubrik&#8230;">

        <!-- Slug — manually editable; "Auto" button regenerates from current title -->
        <div class="slug-row">
          <span class="slug-prefix">/blogg/</span>
          <input id="f-slug" type="text" placeholder="artikel-slug">
          <button class="btn-regen" onclick="regenSlug()"
                  title="Generera fr&#229;n rubrik">Auto</button>
        </div>

        <!-- Hero image — "Välj bild" calls openMediaPicker() from media-picker.js.
             No picker code lives in this file; the integration is a single function call. -->
        <div class="hero-section">
          <div class="hero-label">Hero-bild</div>
          <div class="hero-row">
            <img   id="hero-thumb"       class="hero-thumb" src="" alt="">
            <div   id="hero-placeholder" class="hero-placeholder">&#128247;</div>
            <div>
              <div class="hero-actions">
                <button class="btn-secondary" style="font-size:0.82rem;"
                        onclick="pickHero()">V&#228;lj bild</button>
                <button class="btn-ghost" id="clear-hero-btn" style="display:none;"
                        onclick="clearHero()">Ta bort</button>
              </div>
              <div class="hero-url-note" id="hero-url-note"></div>
            </div>
          </div>
        </div>

        <!-- EasyMDE — see initEditor() for full config:
             image toolbar button → openMediaPicker(),
             previewRender → renderMarkdown() from markdown-renderer.js,
             autosave keyed per post,
             dark theme via CSS overrides above -->
        <textarea id="content-editor"></textarea>

        <!-- Live stats — updated on every keystroke via getContentStats()
             from markdown-renderer.js -->
        <div class="editor-stats" id="editor-stats">
          0 ord &middot; 0 tecken &middot; ca 1 min l&#228;sning
        </div>

      </div><!-- /.editor-main -->

      <!-- ══════════════════════════════════════
           RIGHT COLUMN — sidebar
      ══════════════════════════════════════ -->
      <aside class="editor-sidebar">

        <!-- Publication status + save button -->
        <div class="sidebar-card">
          <h3>Publicering</h3>
          <div class="admin-field">
            <label>Status</label>
            <select id="f-status" onchange="onStatusChange()">
              <option value="draft">Utkast</option>
              <option value="published">Publicerad</option>
              <option value="scheduled">Schemalagd</option>
              <option value="archived">Arkiverad</option>
            </select>
          </div>
          <!-- Shown only when status = scheduled -->
          <div class="admin-field" id="publish-at-row" style="display:none;">
            <label>Schemalagt datum &amp; tid</label>
            <input type="datetime-local" id="f-publish-at">
          </div>
          <div class="admin-field">
            <label>Spr&#229;k</label>
            <select id="f-language">
              <option value="sv">Svenska</option>
              <option value="en">Engelska</option>
            </select>
          </div>
          <!-- is_pinned column exists in schema for future 'pinned article' functionality —
               not yet exposed in this editor UI; add a checkbox here when that feature is built. -->
          <div style="display:flex;flex-direction:column;gap:0.55rem;margin-top:0.6rem;margin-bottom:0.1rem;">
            <label style="display:flex;align-items:center;gap:0.55rem;cursor:pointer;font-size:0.84rem;color:var(--gray-light);user-select:none;">
              <input type="checkbox" id="f-featured" style="width:16px;height:16px;accent-color:var(--blue);cursor:pointer;flex-shrink:0;min-height:unset;">
              Utvald artikel
            </label>
            <label style="display:flex;align-items:center;gap:0.55rem;cursor:pointer;font-size:0.84rem;color:var(--gray-light);user-select:none;">
              <input type="checkbox" id="f-editors-pick" style="width:16px;height:16px;accent-color:var(--blue);cursor:pointer;flex-shrink:0;min-height:unset;">
              Redaktionens val
            </label>
          </div>
          <div style="margin-top:0.85rem;">
            <button class="btn-primary" style="width:100%;" onclick="savePost()">Spara</button>
          </div>
        </div>

        <!-- Excerpt (shown in blog listing) -->
        <div class="sidebar-card">
          <h3>Ingress</h3>
          <div class="admin-field" style="margin:0;">
            <textarea id="f-excerpt" rows="3"
                      placeholder="Kort sammanfattning som visas i blogglistan&#8230;"></textarea>
          </div>
        </div>

        <div class="sidebar-card">
          <h3>Kategori &amp; taggar</h3>

          <!-- Category — single select with inline create -->
          <div class="admin-field">
            <label>Kategori</label>
            <div class="cat-row">
              <select id="f-category">
                <option value="">&#8212; V&#228;lj kategori &#8212;</option>
              </select>
              <button type="button" class="btn-new-cat"
                      onclick="showNewCategoryInput()">+ Ny</button>
            </div>
            <div class="new-cat-row" id="new-cat-row">
              <input type="text" id="new-cat-name"
                     placeholder="Kategorinamn&#8230;"
                     onkeydown="if(event.key==='Enter'){doCreateCategory();}else if(event.key==='Escape'){hideNewCategoryInput();}">
              <button type="button" class="btn-create-cat"
                      onclick="doCreateCategory()">Skapa</button>
              <button type="button" class="btn-cancel-cat"
                      onclick="hideNewCategoryInput()">&#10005;</button>
            </div>
          </div>

          <!-- Tags — multi chip with autocomplete + inline create -->
          <div class="admin-field" style="margin-bottom:0;">
            <label>Taggar</label>
            <div class="tag-input-wrap" id="tag-input-wrap">
              <div class="tag-chips" id="tag-chips"></div>
              <input type="text" id="tag-input" class="admin-field input"
                     autocomplete="off"
                     placeholder="S&#246;k eller skapa tagg&#8230;"
                     oninput="onTagInput()"
                     onkeydown="onTagKeydown(event)">
              <div class="tag-dropdown" id="tag-dropdown" style="display:none;"></div>
            </div>
          </div>
        </div>

        <!-- SEO metadata -->
        <div class="sidebar-card">
          <h3>SEO</h3>
          <div class="admin-field">
            <label>SEO-titel <span style="font-weight:400;font-size:0.8em;">(valfri)</span></label>
            <input type="text" id="f-seo-title" maxlength="60"
                   placeholder="Tom = artikelrubriken anv&#228;nds"
                   oninput="updateSeoLens()">
            <span class="field-hint" id="seo-title-len">0/60</span>
          </div>
          <div class="admin-field" style="margin-bottom:0;">
            <label>Metabeskrivning</label>
            <textarea id="f-seo-desc" rows="3" maxlength="160"
                      placeholder="Kort beskrivning f&#246;r s&#246;kmotorer&#8230;"
                      oninput="updateSeoLens()"></textarea>
            <span class="field-hint" id="seo-desc-len">0/160</span>
          </div>
        </div>

        <div class="sidebar-card">
          <h3>CTA-mall</h3>
          <div class="admin-field">
            <label for="f-cta">Visa CTA-block</label>
            <select id="f-cta" onchange="updateCtaPreview()">
              <option value="">Ingen CTA</option>
            </select>
          </div>
          <!-- Live preview of the selected CTA — populated client-side from allCtaTemplates, no extra query -->
          <div id="cta-preview" style="display:none;margin-top:0.75rem;background:rgba(26,79,255,0.07);border:1px solid rgba(26,79,255,0.22);border-radius:8px;padding:0.85rem 1rem;">
            <div style="font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue-light);margin-bottom:0.45rem;">F&#246;rhandsvisning</div>
            <div id="cta-preview-title" style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1rem;color:var(--white);margin-bottom:0.3rem;"></div>
            <div id="cta-preview-desc" style="font-size:0.78rem;color:var(--gray-light);line-height:1.55;margin-bottom:0.6rem;"></div>
            <span id="cta-preview-btn" style="display:inline-block;background:var(--blue);color:#fff;font-family:'Barlow',sans-serif;font-size:0.75rem;font-weight:700;padding:0.32rem 0.85rem;border-radius:5px;pointer-events:none;"></span>
          </div>
        </div>

        <!-- Related articles override -->
        <div class="sidebar-card">
          <h3>Relaterade artiklar</h3>
          <div style="display:flex;gap:1rem;margin-bottom:0.85rem;">
            <label style="display:flex;align-items:center;gap:0.45rem;cursor:pointer;font-size:0.83rem;color:var(--gray-light);user-select:none;">
              <input type="radio" name="related-mode" value="auto" id="f-related-auto" onchange="onRelatedModeChange()" checked style="accent-color:var(--blue);cursor:pointer;min-height:unset;">
              Automatisk
            </label>
            <label style="display:flex;align-items:center;gap:0.45rem;cursor:pointer;font-size:0.83rem;color:var(--gray-light);user-select:none;">
              <input type="radio" name="related-mode" value="manual" id="f-related-manual" onchange="onRelatedModeChange()" style="accent-color:var(--blue);cursor:pointer;min-height:unset;">
              Manuellt vald
            </label>
          </div>
          <div id="related-manual-panel" style="display:none;">
            <div class="related-chips" id="related-chips"></div>
            <div class="related-input-wrap" id="related-search-wrap">
              <input type="text" id="related-search"
                     placeholder="S&#246;k artikel&#8230;"
                     oninput="onRelatedSearch(this.value)"
                     style="width:100%;box-sizing:border-box;">
              <div class="related-dropdown" id="related-dropdown" style="display:none;"></div>
            </div>
            <span style="font-size:0.69rem;color:var(--gray);display:block;margin-top:0.35rem;">Max 4 artiklar &middot; ordning spelar roll</span>
          </div>
        </div>

      </aside><!-- /.editor-sidebar -->

    </div><!-- /.editor-cols -->
  </main>
</div><!-- /#app -->

<div class="toast" id="toast"></div>


<script>
// ════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════════
// CONTENT BLOCKS ARCHITECTURE NOTE
// Articles use a block-based content architecture (content_blocks jsonb array).
// Currently every article contains exactly one block of type 'markdown', edited
// via EasyMDE. This is intentional groundwork for a future visual block editor
// that will allow inserting additional block types (images, callouts, FAQs,
// comparison tables, etc.) before/between/after the markdown block, without
// requiring any data migration, since all articles are already stored in this
// block-array shape.
// content-block-renderer.js holds the render registry (BLOCK_RENDERERS) and
// generateBlockId(); add new block types there to extend the system.
// ════════════════════════════════════════════════════════════════════

var postId        = null;   // string id from ?id=, set after create or on load
var existingPost  = null;   // full blog_posts row loaded in edit mode
var isNew         = true;   // false once post exists in the DB
var slugDirty     = false;  // true once admin has manually typed in the slug field
var easyMDE       = null;   // EasyMDE instance (assigned in initEditor)
var heroUrl       = '';     // current hero image URL, kept in sync with the preview UI
var existingMarkdownBlockId = null; // block id of the markdown block; preserved across saves so future block-reference features remain stable
var allCategories    = [];  // {id, name, slug, sort_order}[] loaded on init
var allTags          = [];  // {id, name, slug}[] loaded on init, grows as new tags are created
var selectedTags     = [];  // {id, name}[] chips currently selected for this post
var tagDebounce      = null; // debounce timer for tag autocomplete input
var allCtaTemplates      = [];  // {id, name, title, description, button_text, button_link}[] loaded on init
var allPublishedTitles   = [];  // {id, title}[] of published posts, for the manual related-articles picker
var manualRelatedIds     = [];  // ordered array of selected post IDs (strings), mirrors manual_related_ids column
var relatedDebounce      = null;

// ════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════

(async function init() {
  var session = await checkAuth(); // redirects to employe.html if no session
  if (!session) return;

  renderAdminNav('blog');
  document.getElementById('sidebar-user-email').textContent = session.user.email;

  var id = new URLSearchParams(window.location.search).get('id');

  if (id) {
    postId = id;
    isNew  = false;
    // Load post data, categories/tags, and published titles concurrently
    await Promise.all([loadPost(id), loadCategoriesAndTags(), loadPublishedTitles()]);
    // Pre-select category: select is now populated AND category_id is now known
    if (existingPost && existingPost.category_id) {
      document.getElementById('f-category').value = String(existingPost.category_id);
    }
    // Pre-select CTA template (or leave "Ingen CTA" if null)
    if (existingPost && existingPost.cta_template_id) {
      document.getElementById('f-cta').value = String(existingPost.cta_template_id);
      updateCtaPreview();
    }
    // Pre-populate tag chips from the join table
    await loadPostTags(id);
    // Restore related articles mode and manual picks
    if (existingPost) {
      var relMode = existingPost.related_articles_mode || 'auto';
      if (relMode === 'manual') {
        document.getElementById('f-related-manual').checked = true;
        document.getElementById('f-related-auto').checked   = false;
        document.getElementById('related-manual-panel').style.display = '';
        manualRelatedIds = (existingPost.manual_related_ids || []).map(String);
        renderRelatedChips();
      }
    }
  } else {
    await Promise.all([loadCategoriesAndTags(), loadPublishedTitles()]);
  }

  // Reveal page BEFORE initialising EasyMDE so CodeMirror can measure its container
  document.getElementById('app').style.display = 'flex';

  initEditor(id);

  // Inject post content into EasyMDE now that the editor is initialised and visible
  if (existingPost) {
    // Load from content_blocks (new architecture); fall back to legacy content column
    // if content_blocks is empty (migration safety net for any un-migrated rows)
    var _mdToLoad = existingPost.content || '';
    var _blocks   = existingPost.content_blocks;
    if (Array.isArray(_blocks) && _blocks.length > 0) {
      var _mdBlock = _blocks.find(function(b) { return b.type === 'markdown'; });
      if (_mdBlock && _mdBlock.data) {
        _mdToLoad = _mdBlock.data.markdown || '';
        existingMarkdownBlockId = _mdBlock.id || null;
      }
    }
    easyMDE.value(_mdToLoad);
    // Prefer the DB-saved version over any stale localStorage autosave draft
    easyMDE.clearAutosavedValue();
  }

  // Sync any derived UI state that depends on already-populated form values
  updateStats();
  onStatusChange();
  updateSeoLens();

  // Wire title→slug auto-generation after page is visible (avoids early-init issues)
  document.getElementById('f-title').addEventListener('input', onTitleInput);
  document.getElementById('f-slug').addEventListener('input', function() { slugDirty = true; });


  // Dismiss autocomplete dropdowns on outside click
  document.addEventListener('click', function(e) {
    if (!document.getElementById('tag-input-wrap').contains(e.target)) {
      hideTagDropdown();
    }
    var relWrap = document.getElementById('related-search-wrap');
    if (relWrap && !relWrap.contains(e.target)) {
      hideRelatedDropdown();
    }
  });
})();

// ════════════════════════════════════════════════════════════════════
// EASYMDE  —  full configuration
// ════════════════════════════════════════════════════════════════════

function initEditor(idParam) {
  // Autosave key is unique per post so new-post drafts don't clobber edit-mode sessions
  var autosaveKey = 'npc-blog-' + (idParam || 'new');

  easyMDE = new EasyMDE({
    element:      document.getElementById('content-editor'),
    spellChecker: false,
    autofocus:    false,
    status:       false, // word/char/time stats are rendered by updateStats() below
    autosave: {
      enabled:  true,
      uniqueId: autosaveKey,
      delay:    5000,    // write to localStorage every 5 s
    },
    toolbar: [
      'bold', 'italic', 'heading', '|',
      'quote', 'unordered-list', 'ordered-list', '|',
      'link',
      // Image toolbar button: opens the shared media picker from media-picker.js.
      // Choosing an image inserts ![alt](url) at the cursor.
      // openMediaPicker() is the only integration point — no picker logic lives here.
      {
        name:      'image',
        action:    function() {
          openMediaPicker(function(media) {
            var alt = media.alt_text || media.file_name || 'bild';
            easyMDE.codemirror.replaceSelection('![' + alt + '](' + media.public_url + ')');
            easyMDE.codemirror.focus();
          });
        },
        className: 'fa fa-image',
        title:     'Infoga bild från mediabibliotek',
      },
      'code', 'table', 'horizontal-rule', '|',
      'preview', 'side-by-side', 'fullscreen', '|',
      'guide',
    ],
    // Use the shared rendering pipeline from markdown-renderer.js so the admin
    // preview produces identical markup to what the public blog page will render.
    // article-typography.css scopes styles to .article-content, so the div wrapper is required.
    previewRender: function(text) {
      return '<div class="article-content">' + renderMarkdown(text) + '</div>';
    },
  });

  easyMDE.codemirror.on('change', updateStats);
}

// ════════════════════════════════════════════════════════════════════
// TITLE → SLUG AUTO-GENERATION
// slugify() is from admin-shared.js
// ════════════════════════════════════════════════════════════════════

function onTitleInput() {
  // Only auto-generate for brand-new posts that have not had their slug manually edited
  if (!isNew || slugDirty) return;
  document.getElementById('f-slug').value =
    slugify(document.getElementById('f-title').value);
}

function regenSlug() {
  document.getElementById('f-slug').value =
    slugify(document.getElementById('f-title').value);
}

// ════════════════════════════════════════════════════════════════════
// HERO IMAGE
// openMediaPicker() is from media-picker.js — the entire integration is one call
// ════════════════════════════════════════════════════════════════════

function pickHero() {
  openMediaPicker(function(media) {
    setHeroPreview(media.public_url);
    showToast('Hero-bild vald.', 't-green');
  });
}

function clearHero() {
  setHeroPreview('');
}

function setHeroPreview(url) {
  var thumb    = document.getElementById('hero-thumb');
  var ph       = document.getElementById('hero-placeholder');
  var clearBtn = document.getElementById('clear-hero-btn');
  var note     = document.getElementById('hero-url-note');

  heroUrl = url || '';

  if (url) {
    thumb.src              = url;
    thumb.style.display    = 'block';
    ph.style.display       = 'none';
    clearBtn.style.display = '';
    note.textContent       = url;
  } else {
    thumb.style.display    = 'none';
    ph.style.display       = 'flex';
    clearBtn.style.display = 'none';
    note.textContent       = '';
  }
}

// ════════════════════════════════════════════════════════════════════
// STATUS / PUBLISH DATE
// ════════════════════════════════════════════════════════════════════

function onStatusChange() {
  var s = document.getElementById('f-status').value;
  document.getElementById('publish-at-row').style.display =
    s === 'scheduled' ? '' : 'none';
}

// ════════════════════════════════════════════════════════════════════
// SEO CHARACTER COUNTERS
// ════════════════════════════════════════════════════════════════════

function updateSeoLens() {
  var t = document.getElementById('f-seo-title').value.length;
  var d = document.getElementById('f-seo-desc').value.length;
  document.getElementById('seo-title-len').textContent = t + '/60';
  document.getElementById('seo-desc-len').textContent  = d + '/160';
}

// ════════════════════════════════════════════════════════════════════
// LIVE STATS
// getContentStats() is from markdown-renderer.js
// ════════════════════════════════════════════════════════════════════

function updateStats() {
  if (!easyMDE) return;
  var s = getContentStats(easyMDE.value());
  document.getElementById('editor-stats').textContent =
    s.wordCount + ' ord · ' + s.charCount + ' tecken · ca ' +
    s.readingTimeMinutes + ' min läsning';
}

// ════════════════════════════════════════════════════════════════════
// LOAD  (edit mode)
// Note: EasyMDE content is injected AFTER initEditor() in the init flow above,
// not here, because easyMDE does not exist yet when loadPost() is called.
// ════════════════════════════════════════════════════════════════════

async function loadPost(id) {
  var res = await supabaseClient
    .from('blog_posts')
    .select('*')
    .eq('id', id)
    .single();

  if (res.error || !res.data) {
    showToast(
      'Kunde inte ladda artikeln: ' + (res.error ? res.error.message : 'okänt fel'),
      't-red'
    );
    return;
  }

  existingPost = res.data;

  document.getElementById('page-title').textContent = 'Redigera artikel';
  document.title = (res.data.title || 'Artikel') + ' – Nordic PC Admin';

  document.getElementById('f-title').value     = res.data.title    || '';
  document.getElementById('f-slug').value      = res.data.slug     || '';
  document.getElementById('f-status').value              = res.data.status         || 'draft';
  document.getElementById('f-language').value            = res.data.language       || 'sv';
  document.getElementById('f-featured').checked          = !!res.data.is_featured;
  document.getElementById('f-editors-pick').checked      = !!res.data.is_editors_pick;
  document.getElementById('f-excerpt').value   = res.data.excerpt  || '';
  document.getElementById('f-seo-title').value = res.data.seo_title        || '';
  document.getElementById('f-seo-desc').value  = res.data.seo_description  || '';

  if (res.data.publish_at) {
    document.getElementById('f-publish-at').value = res.data.publish_at.slice(0, 16);
  }

  if (res.data.hero_image_url) {
    setHeroPreview(res.data.hero_image_url);
  }
}

// ════════════════════════════════════════════════════════════════════
// SAVE
// New post: INSERT then redirect to blog-editor.html?id={newId}
// Existing: UPDATE in place, show toast
// ════════════════════════════════════════════════════════════════════

async function savePost() {
  var title    = document.getElementById('f-title').value.trim();
  var slug     = document.getElementById('f-slug').value.trim();
  var content  = easyMDE.value();

  // Build content_blocks — preserve the existing block id so any future feature
  // referencing a specific block by id remains stable across saves.
  // generateBlockId() is only called for brand-new posts (existingMarkdownBlockId is null).
  var contentBlocks = [{
    id:   existingMarkdownBlockId || generateBlockId(),
    type: 'markdown',
    data: { markdown: content }
  }];

  var status   = document.getElementById('f-status').value;
  var language = document.getElementById('f-language').value;
  var excerpt  = document.getElementById('f-excerpt').value.trim()   || null;
  var seoTitle = document.getElementById('f-seo-title').value.trim() || null;
  var seoDesc  = document.getElementById('f-seo-desc').value.trim()  || null;
  var publishAtRaw = document.getElementById('f-publish-at').value;
  var publish_at   = (status === 'scheduled' && publishAtRaw)
    ? new Date(publishAtRaw).toISOString()
    : null;

  if (!title) { showToast('Rubrik krävs.', 't-red'); return; }
  if (!slug)  { showToast('Slug krävs.', 't-red');   return; }

  var isFeatured     = document.getElementById('f-featured').checked;
  var isEditorsPick  = document.getElementById('f-editors-pick').checked;

  // Auto-unfeature: ensure no other post keeps is_featured = true when this one is being featured.
  // Must run BEFORE the insert/update so this post ends up as the sole featured post.
  if (isFeatured) {
    var unfeatureQuery = supabaseClient
      .from('blog_posts')
      .update({ is_featured: false })
      .eq('is_featured', true);
    // In edit mode, exclude the current post's own row (it already has is_featured = true
    // and we're about to set it again — excluding it avoids a no-op extra update on itself).
    // In create mode there is no current post id yet, so no exclusion needed.
    if (!isNew) unfeatureQuery = unfeatureQuery.neq('id', postId);
    var unfeatRes = await unfeatureQuery;
    if (unfeatRes.error) {
      showToast('Kunde inte nollst&#228;lla befintlig utvald artikel: ' + unfeatRes.error.message, 't-red');
      return;
    }
  }

  var payload = {
    title:           title,
    slug:            slug,
    content:         content,         // legacy column — kept as safety net during transition
    content_blocks:  contentBlocks,   // new block-based structure
    excerpt:         excerpt,
    hero_image_url:  heroUrl || null,
    seo_title:       seoTitle,
    seo_description: seoDesc,
    status:          status,
    language:        language,
    publish_at:      publish_at,
    updated_at:      new Date().toISOString(),
    category_id:     document.getElementById('f-category').value || null,
    cta_template_id: document.getElementById('f-cta').value || null,
    is_featured:          isFeatured,
    is_editors_pick:      isEditorsPick,
    related_articles_mode: document.querySelector('input[name="related-mode"]:checked').value,
    manual_related_ids:    manualRelatedIds.map(function(id) { return parseInt(id, 10); }),
  };

  if (!isNew) {
    // ── UPDATE existing post ──
    var upd = await supabaseClient
      .from('blog_posts')
      .update(payload)
      .eq('id', postId);

    if (upd.error) {
      showToast(
        upd.error.message.includes('unique')
          ? 'En artikel med denna slug finns redan.'
          : 'Sparfel: ' + upd.error.message,
        't-red'
      );
      return;
    }

    if (existingPost) Object.assign(existingPost, payload);
    await savePostTags(postId);
    document.title = title + ' – Nordic PC Admin';
    showToast('Artikel sparad.', 't-green');

  } else {
    // ── INSERT new post, then redirect to edit mode ──
    var ins = await supabaseClient
      .from('blog_posts')
      .insert(payload)
      .select('id')
      .single();

    if (ins.error) {
      showToast(
        ins.error.message.includes('unique')
          ? 'En artikel med denna slug finns redan.'
          : 'Sparfel: ' + ins.error.message,
        't-red'
      );
      return;
    }

    // Save tags before navigating — can't do it after since the page redirects away
    await savePostTags(ins.data.id);
    // Redirect so the page re-initialises cleanly in edit mode with the new ID.
    // EasyMDE autosave on the returned page will use key 'npc-blog-{id}' (not 'npc-blog-new'),
    // so the draft from create mode doesn't interfere.
    window.location.href = 'blog-editor.html?id=' + ins.data.id;
  }
}

// ════════════════════════════════════════════════════════════════════
// CATEGORIES
// slugify() from admin-shared.js is used for all slug generation —
// ensures "SSD" and "ssd" and "Ssd" all normalize to the same slug
// and are treated as the same category rather than creating duplicates
// ════════════════════════════════════════════════════════════════════

async function loadCategoriesAndTags() {
  var catRes = await supabaseClient.from('categories').select('*').order('sort_order');
  if (!catRes.error) {
    allCategories = catRes.data || [];
    populateCategorySelect();
  }
  var tagRes = await supabaseClient.from('tags').select('*').order('name');
  if (!tagRes.error) allTags = tagRes.data || [];

  var ctaRes = await supabaseClient.from('cta_templates').select('*').order('name');
  if (!ctaRes.error) {
    allCtaTemplates = ctaRes.data || [];
    populateCtaSelect();
  }
}

function populateCategorySelect() {
  var sel  = document.getElementById('f-category');
  var prev = sel.value;
  sel.innerHTML = '<option value="">— V\xe4lj kategori —</option>';
  allCategories.forEach(function(c) {
    var opt = document.createElement('option');
    opt.value       = String(c.id);
    opt.textContent = c.name;
    sel.appendChild(opt);
  });
  if (prev) sel.value = prev; // preserve any selection already made
}

function populateCtaSelect() {
  var sel  = document.getElementById('f-cta');
  var prev = sel.value;
  sel.innerHTML = '<option value="">Ingen CTA</option>';
  allCtaTemplates.forEach(function(t) {
    var opt = document.createElement('option');
    opt.value       = String(t.id);
    opt.textContent = t.name;
    sel.appendChild(opt);
  });
  if (prev) sel.value = prev;
  updateCtaPreview();
}

function updateCtaPreview() {
  var id  = document.getElementById('f-cta').value;
  var box = document.getElementById('cta-preview');
  if (!id) { box.style.display = 'none'; return; }
  var tpl = allCtaTemplates.find(function(t) { return String(t.id) === id; });
  if (!tpl) { box.style.display = 'none'; return; }
  document.getElementById('cta-preview-title').textContent = tpl.title       || '';
  document.getElementById('cta-preview-desc').textContent  = tpl.description || '';
  document.getElementById('cta-preview-btn').textContent   = tpl.button_text || '';
  box.style.display = 'block';
}

function showNewCategoryInput() {
  document.getElementById('new-cat-row').style.display = 'flex';
  document.getElementById('new-cat-name').focus();
}

function hideNewCategoryInput() {
  document.getElementById('new-cat-row').style.display = 'none';
  document.getElementById('new-cat-name').value = '';
}

async function doCreateCategory() {
  var name = document.getElementById('new-cat-name').value.trim();
  if (!name) return;
  var slug = slugify(name); // slugify() from admin-shared.js

  // Check existing by normalized slug — prevents "SSD" and "ssd" becoming two categories
  var existing = allCategories.find(function(c) { return c.slug === slug; });
  if (existing) {
    document.getElementById('f-category').value = String(existing.id);
    hideNewCategoryInput();
    showToast('Kategorin finns redan, väljer befintlig.', 't-amber');
    return;
  }

  var res = await supabaseClient.from('categories').insert({ name: name, slug: slug }).select().single();
  if (res.error) { showToast('Kunde inte skapa kategori: ' + res.error.message, 't-red'); return; }

  allCategories.push(res.data);
  populateCategorySelect();
  document.getElementById('f-category').value = String(res.data.id);
  hideNewCategoryInput();
  showToast('Kategori skapad.', 't-green');
}

// ════════════════════════════════════════════════════════════════════
// TAGS — chips, autocomplete, inline create
// Same slug-based duplicate prevention as categories
// ════════════════════════════════════════════════════════════════════

async function loadPostTags(id) {
  var res = await supabaseClient
    .from('blog_post_tags')
    .select('tag_id, tags(id, name)')
    .eq('post_id', id);
  if (res.error || !res.data) return;
  res.data.forEach(function(row) { if (row.tags) addTagChip(row.tags); });
}

function addTagChip(tag) {
  if (selectedTags.some(function(t) { return String(t.id) === String(tag.id); })) return;
  selectedTags.push({ id: tag.id, name: tag.name });
  renderTagChips();
}

function removeTagChip(tagId) {
  selectedTags = selectedTags.filter(function(t) { return String(t.id) !== String(tagId); });
  renderTagChips();
}

function renderTagChips() {
  document.getElementById('tag-chips').innerHTML = selectedTags.map(function(t) {
    return '<span class="tag-chip">' +
      escH(t.name) +
      '<button type="button" class="tag-chip-remove" ' +
        'onclick="removeTagChip(\'' + escAttr(String(t.id)) + '\')" ' +
        'aria-label="Ta bort ' + escAttr(t.name) + '">×</button>' +
      '</span>';
  }).join('');
}

function onTagInput() {
  clearTimeout(tagDebounce);
  tagDebounce = setTimeout(function() {
    var q = document.getElementById('tag-input').value.trim();
    if (!q) { hideTagDropdown(); return; }
    var lower   = q.toLowerCase();
    var matches = allTags.filter(function(t) { return t.name.toLowerCase().includes(lower); });
    showTagDropdown(matches, q);
  }, 250);
}

function onTagKeydown(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    var raw = document.getElementById('tag-input').value.replace(/,$/, '').trim();
    if (raw) doAddTag(raw);
  } else if (e.key === 'Escape') {
    hideTagDropdown();
  }
}

function showTagDropdown(matches, query) {
  var dropdown = document.getElementById('tag-dropdown');
  dropdown.innerHTML = '';

  matches.forEach(function(tag) {
    var row = document.createElement('div');
    row.className = 'tag-dd-item';
    row.textContent = tag.name;
    row.addEventListener('click', function() {
      selectExistingTag(tag.id);
    });
    dropdown.appendChild(row);
  });

  var querySlug = slugify(query);
  var hasExactMatch = allTags.some(function(t) { return t.slug === querySlug; });

  if (!hasExactMatch && query.trim().length > 0) {
    var createRow = document.createElement('div');
    createRow.className = 'tag-dd-item tag-dd-create';
    createRow.textContent = '+ Skapa ny tagg: "' + query + '"';
    createRow.addEventListener('click', function() {
      doAddTag(query);
    });
    dropdown.appendChild(createRow);
  }

  dropdown.style.display = dropdown.children.length > 0 ? 'block' : 'none';
}

function hideTagDropdown() {
  var dd = document.getElementById('tag-dropdown');
  if (dd) dd.style.display = 'none';
}

function selectExistingTag(tagId) {
  var tag = allTags.find(function(t) { return String(t.id) === String(tagId); });
  if (tag) addTagChip(tag);
  document.getElementById('tag-input').value = '';
  hideTagDropdown();
}

async function doAddTag(name) {
  name = (name || '').trim();
  if (!name) return;
  var slug = slugify(name);

  // Reuse existing tag with same normalized slug — prevents "ssd" creating a duplicate of "SSD"
  var existing = allTags.find(function(t) { return t.slug === slug; });
  if (existing) {
    addTagChip(existing);
    document.getElementById('tag-input').value = '';
    hideTagDropdown();
    return;
  }

  var res = await supabaseClient.from('tags').insert({ name: name, slug: slug }).select().single();
  if (res.error) { showToast('Kunde inte skapa tagg: ' + res.error.message, 't-red'); return; }

  allTags.push(res.data);
  addTagChip(res.data);
  document.getElementById('tag-input').value = '';
  hideTagDropdown();
}

// ════════════════════════════════════════════════════════════════════
// RELATED ARTICLES — manual picker
// ════════════════════════════════════════════════════════════════════

async function loadPublishedTitles() {
  var query = supabaseClient
    .from('blog_posts')
    .select('id, title')
    .eq('status', 'published')
    .order('created_at', { ascending: false });
  // Exclude current post in edit mode so it doesn't appear as its own related pick
  if (postId) query = query.neq('id', postId);
  var res = await query;
  if (!res.error) allPublishedTitles = res.data || [];
}

function onRelatedModeChange() {
  var mode = document.querySelector('input[name="related-mode"]:checked').value;
  document.getElementById('related-manual-panel').style.display = mode === 'manual' ? '' : 'none';
}

function onRelatedSearch(val) {
  clearTimeout(relatedDebounce);
  var q = val.trim();
  if (!q) { hideRelatedDropdown(); return; }
  relatedDebounce = setTimeout(function() { showRelatedDropdown(q); }, 160);
}

function showRelatedDropdown(q) {
  if (manualRelatedIds.length >= 4) { hideRelatedDropdown(); return; }
  var lq = q.toLowerCase();
  var selectedSet = new Set(manualRelatedIds.map(String));
  var matches = allPublishedTitles
    .filter(function(p) {
      return !selectedSet.has(String(p.id)) && (p.title || '').toLowerCase().includes(lq);
    })
    .slice(0, 8);
  var dd = document.getElementById('related-dropdown');
  if (!matches.length) { dd.style.display = 'none'; return; }
  dd.innerHTML = matches.map(function(p) {
    return '<div class="related-dd-item" onclick="addRelatedArticle(\'' + escH(String(p.id)) + '\', ' + JSON.stringify(p.title || '') + ')">' + escH(p.title || '') + '</div>';
  }).join('');
  dd.style.display = 'block';
}

function hideRelatedDropdown() {
  var dd = document.getElementById('related-dropdown');
  if (dd) dd.style.display = 'none';
}

function addRelatedArticle(id, title) {
  if (manualRelatedIds.length >= 4) return;
  if (manualRelatedIds.indexOf(String(id)) !== -1) return;
  manualRelatedIds.push(String(id));
  // Ensure title is available in allPublishedTitles (it should be, since it came from the dropdown)
  if (!allPublishedTitles.find(function(p) { return String(p.id) === String(id); })) {
    allPublishedTitles.push({ id: id, title: title });
  }
  renderRelatedChips();
  var inp = document.getElementById('related-search');
  if (inp) inp.value = '';
  hideRelatedDropdown();
}

function removeRelatedArticle(id) {
  manualRelatedIds = manualRelatedIds.filter(function(x) { return x !== String(id); });
  renderRelatedChips();
}

function moveRelatedArticle(id, dir) {
  var idx = manualRelatedIds.indexOf(String(id));
  if (idx < 0) return;
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= manualRelatedIds.length) return;
  var arr = manualRelatedIds.slice();
  var tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
  manualRelatedIds = arr;
  renderRelatedChips();
}

function renderRelatedChips() {
  var titleMap = {};
  allPublishedTitles.forEach(function(p) { titleMap[String(p.id)] = p.title || ('ID: ' + p.id); });

  var chips      = document.getElementById('related-chips');
  var searchWrap = document.getElementById('related-search-wrap');

  chips.innerHTML = manualRelatedIds.map(function(id, i) {
    var title  = titleMap[id] || ('ID: ' + id);
    var isFirst = i === 0;
    var isLast  = i === manualRelatedIds.length - 1;
    return '<div class="related-chip">' +
      '<button class="related-chip-move" onclick="moveRelatedArticle(\'' + escH(id) + '\',-1)" ' + (isFirst ? 'disabled' : '') + ' title="Flytta upp" aria-label="Flytta upp">&#9650;</button>' +
      '<button class="related-chip-move" onclick="moveRelatedArticle(\'' + escH(id) + '\',1)" '  + (isLast  ? 'disabled' : '') + ' title="Flytta ned" aria-label="Flytta ned">&#9660;</button>' +
      '<span class="related-chip-title" title="' + escH(title) + '">' + escH(title) + '</span>' +
      '<button class="related-chip-remove" onclick="removeRelatedArticle(\'' + escH(id) + '\')" aria-label="Ta bort">&times;</button>' +
    '</div>';
  }).join('');

  // Hide search input once 4 are selected; re-show if one is removed
  if (searchWrap) searchWrap.style.display = manualRelatedIds.length >= 4 ? 'none' : '';
}

// ════════════════════════════════════════════════════════════════════
// SAVE TAGS — delete-and-reinsert for both create and edit modes.
// DELETE of non-existent rows is a safe no-op, so new posts can use
// the same function without special-casing.
// ════════════════════════════════════════════════════════════════════

async function savePostTags(savedPostId) {
  var del = await supabaseClient.from('blog_post_tags').delete().eq('post_id', savedPostId);
  if (del.error) {
    showToast('Taggfel (rensa): ' + del.error.message, 't-amber');
    return;
  }
  if (selectedTags.length === 0) return;
  var rows = selectedTags.map(function(t) { return { post_id: savedPostId, tag_id: t.id }; });
  var ins  = await supabaseClient.from('blog_post_tags').insert(rows);
  if (ins.error) showToast('Taggfel (spara): ' + ins.error.message, 't-amber');
}
</script>
