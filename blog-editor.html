<style>
/* ── Editor layout ── */
.editor-header{display:flex;align-items:center;gap:0.85rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.editor-header h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;text-transform:uppercase;letter-spacing:0.02em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
a.btn-back{display:inline-flex;align-items:center;gap:0.35rem;text-decoration:none;flex-shrink:0;}
.editor-cols{display:grid;grid-template-columns:1fr 300px;gap:1.25rem;align-items:start;}
.editor-main{display:flex;flex-direction:column;gap:0.75rem;min-width:0;}
.editor-sidebar{display:flex;flex-direction:column;gap:0.75rem;position:sticky;top:1rem;}

/* ── Title ── */
.title-input{width:100%;box-sizing:border-box;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.55rem;letter-spacing:0.02em;background:var(--dark3);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:var(--white);padding:0.65rem 0.9rem;outline:none;transition:border-color 0.2s;}
.title-input:focus{border-color:var(--blue);}
.title-input::placeholder{color:var(--gray);font-weight:600;}

/* ── Slug ── */
.slug-row{display:flex;align-items:center;gap:0.45rem;background:var(--dark3);border:1px solid rgba(255,255,255,0.08);border-radius:7px;padding:0.38rem 0.7rem;}
.slug-prefix{font-size:0.76rem;color:var(--gray);font-family:monospace;white-space:nowrap;}
.slug-row input{flex:1;min-width:0;background:transparent;border:none;color:var(--gray-light);font-family:monospace;font-size:0.78rem;outline:none;}
.slug-row input:focus{color:var(--white);}
.btn-regen{background:var(--dark4);border:1px solid rgba(255,255,255,0.1);color:var(--gray);border-radius:4px;padding:0.18rem 0.5rem;font-size:0.7rem;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;white-space:nowrap;transition:color 0.15s,border-color 0.15s;}
.btn-regen:hover{color:var(--white);border-color:rgba(255,255,255,0.3);}

/* ── Hero image ── */
.hero-section{background:var(--dark2);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:1rem 1.1rem;}
.hero-label{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);margin-bottom:0.75rem;}
.hero-row{display:flex;align-items:flex-start;gap:0.9rem;flex-wrap:wrap;}
.hero-thumb{width:130px;height:82px;object-fit:cover;border-radius:6px;border:1px solid rgba(255,255,255,0.1);flex-shrink:0;display:none;}
.hero-placeholder{width:130px;height:82px;background:var(--dark3);border:2px dashed rgba(255,255,255,0.1);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:1.6rem;flex-shrink:0;}
.hero-actions{display:flex;flex-direction:column;gap:0.4rem;}
.hero-url-note{font-size:0.68rem;color:var(--gray);font-family:monospace;word-break:break-all;max-width:240px;margin-top:0.3rem;line-height:1.45;}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--gray);border-radius:5px;padding:0.35rem 0.7rem;font-size:0.78rem;cursor:pointer;font-family:'Barlow',sans-serif;transition:color 0.15s,border-color 0.15s;}
.btn-ghost:hover{color:var(--red);border-color:var(--red);}

/* ── Live stats ── */
.editor-stats{font-size:0.75rem;color:var(--gray);padding:0.35rem 0;}

/* ── Sidebar cards ── */
.sidebar-card{background:var(--dark2);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:1rem 1.1rem;}
.sidebar-card h3{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);margin:0 0 0.85rem 0;}
.placeholder-note{font-size:0.78rem;color:var(--gray);margin:0;font-style:italic;}
.field-hint{font-size:0.69rem;color:var(--gray);display:block;text-align:right;margin-top:0.15rem;}

/* ── EasyMDE dark theme overrides ── */
.EasyMDEContainer{border:1px solid rgba(255,255,255,0.1) !important;border-radius:8px !important;overflow:hidden;}
.EasyMDEContainer .editor-toolbar{background:var(--dark2) !important;border-bottom:1px solid rgba(255,255,255,0.08) !important;border-top:none;padding:4px 6px;}
.EasyMDEContainer .editor-toolbar button{color:var(--gray-light) !important;background:transparent !important;border:none;border-radius:4px;}
.EasyMDEContainer .editor-toolbar button:hover,
.EasyMDEContainer .editor-toolbar button.active{background:var(--dark3) !important;color:var(--white) !important;}
.EasyMDEContainer .editor-toolbar i.separator{border-color:rgba(255,255,255,0.12) !important;}
.EasyMDEContainer .CodeMirror{background:var(--dark3) !important;color:var(--gray-light) !important;border:none !important;font-size:0.9rem;line-height:1.72;padding:1rem 1.1rem;min-height:380px;}
.EasyMDEContainer .CodeMirror-scroll{min-height:380px;}
.EasyMDEContainer .CodeMirror-cursor{border-left-color:var(--white) !important;}
.EasyMDEContainer .CodeMirror-selected,
.EasyMDEContainer .CodeMirror-focused .CodeMirror-selected{background:rgba(26,79,255,0.3) !important;}
.EasyMDEContainer .CodeMirror-line span.cm-header{color:var(--white) !important;font-weight:700;}
.EasyMDEContainer .CodeMirror-line span.cm-strong{color:var(--white) !important;}
.EasyMDEContainer .CodeMirror-line span.cm-link,
.EasyMDEContainer .CodeMirror-line span.cm-url{color:#7aa5ff !important;}
.EasyMDEContainer .CodeMirror-line span.cm-quote{color:var(--gray) !important;}
.EasyMDEContainer .CodeMirror-line span.cm-code{color:var(--accent) !important;}
.EasyMDEContainer .editor-preview,
.EasyMDEContainer .editor-preview-side{background:var(--dark2) !important;color:var(--gray-light) !important;border-left:1px solid rgba(255,255,255,0.08) !important;padding:1.25rem 1.5rem;}
.EasyMDEContainer .editor-statusbar{background:var(--dark2) !important;border-top:1px solid rgba(255,255,255,0.08) !important;color:var(--gray) !important;padding:0.35rem 0.9rem;}

@media(max-width:900px){.editor-cols{grid-template-columns:1fr;}.editor-sidebar{position:static;}}
@media(max-width:540px){.editor-header h1{font-size:1.25rem;}}
</style>

<body>

<div id="app" style="display:none;">
  <div id="admin-nav"></div>

  <main class="admin-main">

    <!-- ── PAGE HEADER ── -->
    <div class="editor-header">
      <a class="btn-secondary btn-back" href="blog-admin.html">&#8592; Artiklar</a>
      <h1 id="page-title">Ny artikel</h1>
      <div>
        <button class="btn-primary" onclick="savePost()">Spara</button>
      </div>
    </div>

    <div class="editor-cols">

      <!-- ══════════════════════════════════════
           LEFT COLUMN — main content area
      ══════════════════════════════════════ -->
      <div class="editor-main">

        <!-- Title — auto-generates slug via slugify() from admin-shared.js
             unless the admin has manually edited the slug field -->
        <input class="title-input" id="f-title" type="text"
               placeholder="Artikelns rubrik&#8230;">

        <!-- Slug — manually editable; "Auto" button regenerates from current title -->
        <div class="slug-row">
          <span class="slug-prefix">/blogg/</span>
          <input id="f-slug" type="text" placeholder="artikel-slug">
          <button class="btn-regen" onclick="regenSlug()"
                  title="Generera fr&#229;n rubrik">Auto</button>
        </div>

        <!-- Hero image — "Välj bild" calls openMediaPicker() from media-picker.js.
             No picker code lives in this file; the integration is a single function call. -->
        <div class="hero-section">
          <div class="hero-label">Hero-bild</div>
          <div class="hero-row">
            <img   id="hero-thumb"       class="hero-thumb" src="" alt="">
            <div   id="hero-placeholder" class="hero-placeholder">&#128247;</div>
            <div>
              <div class="hero-actions">
                <button class="btn-secondary" style="font-size:0.82rem;"
                        onclick="pickHero()">V&#228;lj bild</button>
                <button class="btn-ghost" id="clear-hero-btn" style="display:none;"
                        onclick="clearHero()">Ta bort</button>
              </div>
              <div class="hero-url-note" id="hero-url-note"></div>
            </div>
          </div>
        </div>

        <!-- EasyMDE — see initEditor() for full config:
             image toolbar button → openMediaPicker(),
             previewRender → renderMarkdown() from markdown-renderer.js,
             autosave keyed per post,
             dark theme via CSS overrides above -->
        <textarea id="content-editor"></textarea>

        <!-- Live stats — updated on every keystroke via getContentStats()
             from markdown-renderer.js -->
        <div class="editor-stats" id="editor-stats">
          0 ord &middot; 0 tecken &middot; ca 1 min l&#228;sning
        </div>

      </div><!-- /.editor-main -->

      <!-- ══════════════════════════════════════
           RIGHT COLUMN — sidebar
      ══════════════════════════════════════ -->
      <aside class="editor-sidebar">

        <!-- Publication status + save button -->
        <div class="sidebar-card">
          <h3>Publicering</h3>
          <div class="admin-field">
            <label>Status</label>
            <select id="f-status" onchange="onStatusChange()">
              <option value="draft">Utkast</option>
              <option value="published">Publicerad</option>
              <option value="scheduled">Schemalagd</option>
            </select>
          </div>
          <!-- Shown only when status = scheduled -->
          <div class="admin-field" id="publish-at-row" style="display:none;">
            <label>Schemalagt datum &amp; tid</label>
            <input type="datetime-local" id="f-publish-at">
          </div>
          <div class="admin-field">
            <label>Spr&#229;k</label>
            <select id="f-language">
              <option value="sv">Svenska</option>
              <option value="en">Engelska</option>
            </select>
          </div>
          <div style="margin-top:0.85rem;">
            <button class="btn-primary" style="width:100%;" onclick="savePost()">Spara</button>
          </div>
        </div>

        <!-- Excerpt (shown in blog listing) -->
        <div class="sidebar-card">
          <h3>Ingress</h3>
          <div class="admin-field" style="margin:0;">
            <textarea id="f-excerpt" rows="3"
                      placeholder="Kort sammanfattning som visas i blogglistan&#8230;"></textarea>
          </div>
        </div>

        <!--
          ════════════════════════════════════════
          TODO (next pass): Category & Tags
          ════════════════════════════════════════
          Add a <select id="f-category"> populated from:
            supabaseClient.from('categories').select('id, name').order('sort_order')
          And a tags multi-select widget backed by the blog_post_tags join table.

          In savePost(), replace the hardcoded null below with:
            category_id: document.getElementById('f-category').value || null

          In loadPost(), restore the selection with:
            document.getElementById('f-category').value = data.category_id || '';
        -->
        <div class="sidebar-card">
          <h3>Kategori &amp; taggar</h3>
          <p class="placeholder-note">Byggs ut i n&#228;sta pass.</p>
        </div>

        <!-- SEO metadata -->
        <div class="sidebar-card">
          <h3>SEO</h3>
          <div class="admin-field">
            <label>SEO-titel <span style="font-weight:400;font-size:0.8em;">(valfri)</span></label>
            <input type="text" id="f-seo-title" maxlength="60"
                   placeholder="Tom = artikelrubriken anv&#228;nds"
                   oninput="updateSeoLens()">
            <span class="field-hint" id="seo-title-len">0/60</span>
          </div>
          <div class="admin-field" style="margin-bottom:0;">
            <label>Metabeskrivning</label>
            <textarea id="f-seo-desc" rows="3" maxlength="160"
                      placeholder="Kort beskrivning f&#246;r s&#246;kmotorer&#8230;"
                      oninput="updateSeoLens()"></textarea>
            <span class="field-hint" id="seo-desc-len">0/160</span>
          </div>
        </div>

        <!--
          ════════════════════════════════════════
          TODO (next pass): CTA Template
          ════════════════════════════════════════
          Add a <select id="f-cta"> populated from:
            supabaseClient.from('cta_templates').select('id, name').order('name')
          with a blank "Ingen CTA" first option.

          In savePost(), replace the hardcoded null below with:
            cta_template_id: document.getElementById('f-cta').value || null

          In loadPost(), restore the selection with:
            document.getElementById('f-cta').value = data.cta_template_id || '';
        -->
        <div class="sidebar-card">
          <h3>CTA-mall</h3>
          <p class="placeholder-note">Byggs ut i n&#228;sta pass.</p>
        </div>

      </aside><!-- /.editor-sidebar -->

    </div><!-- /.editor-cols -->
  </main>
</div><!-- /#app -->

<div class="toast" id="toast"></div>


<script>
// ════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════

var postId       = null;   // string id from ?id=, set after create or on load
var existingPost = null;   // full blog_posts row loaded in edit mode
var isNew        = true;   // false once post exists in the DB
var slugDirty    = false;  // true once admin has manually typed in the slug field
var easyMDE      = null;   // EasyMDE instance (assigned in initEditor)
var heroUrl      = '';     // current hero image URL, kept in sync with the preview UI

// ════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════

(async function init() {
  var session = await checkAuth(); // redirects to employe.html if no session
  if (!session) return;

  renderAdminNav('blog');
  document.getElementById('sidebar-user-email').textContent = session.user.email;

  var id = new URLSearchParams(window.location.search).get('id');

  if (id) {
    postId = id;
    isNew  = false;
    await loadPost(id); // populates existingPost + form fields (except EasyMDE content)
  }

  // Reveal page BEFORE initialising EasyMDE so CodeMirror can measure its container
  document.getElementById('app').style.display = 'flex';

  initEditor(id);

  // Inject post content into EasyMDE now that the editor is initialised and visible
  if (existingPost) {
    easyMDE.value(existingPost.content || '');
    // Prefer the DB-saved version over any stale localStorage autosave draft
    easyMDE.clearAutosavedValue();
  }

  // Sync any derived UI state that depends on already-populated form values
  updateStats();
  onStatusChange();
  updateSeoLens();

  // Wire title→slug auto-generation after page is visible (avoids early-init issues)
  document.getElementById('f-title').addEventListener('input', onTitleInput);
  document.getElementById('f-slug').addEventListener('input', function() { slugDirty = true; });
})();

// ════════════════════════════════════════════════════════════════════
// EASYMDE  —  full configuration
// ════════════════════════════════════════════════════════════════════

function initEditor(idParam) {
  // Autosave key is unique per post so new-post drafts don't clobber edit-mode sessions
  var autosaveKey = 'npc-blog-' + (idParam || 'new');

  easyMDE = new EasyMDE({
    element:      document.getElementById('content-editor'),
    spellChecker: false,
    autofocus:    false,
    status:       false, // word/char/time stats are rendered by updateStats() below
    autosave: {
      enabled:  true,
      uniqueId: autosaveKey,
      delay:    5000,    // write to localStorage every 5 s
    },
    toolbar: [
      'bold', 'italic', 'heading', '|',
      'quote', 'unordered-list', 'ordered-list', '|',
      'link',
      // Image toolbar button: opens the shared media picker from media-picker.js.
      // Choosing an image inserts ![alt](url) at the cursor.
      // openMediaPicker() is the only integration point — no picker logic lives here.
      {
        name:      'image',
        action:    function() {
          openMediaPicker(function(media) {
            var alt = media.alt_text || media.file_name || 'bild';
            easyMDE.codemirror.replaceSelection('![' + alt + '](' + media.public_url + ')');
            easyMDE.codemirror.focus();
          });
        },
        className: 'fa fa-image',
        title:     'Infoga bild från mediabibliotek',
      },
      'code', 'table', 'horizontal-rule', '|',
      'preview', 'side-by-side', 'fullscreen', '|',
      'guide',
    ],
    // Use the shared rendering pipeline from markdown-renderer.js so the admin
    // preview produces identical markup to what the public blog page will render.
    // article-typography.css scopes styles to .article-content, so the div wrapper is required.
    previewRender: function(text) {
      return '<div class="article-content">' + renderMarkdown(text) + '</div>';
    },
  });

  easyMDE.codemirror.on('change', updateStats);
}

// ════════════════════════════════════════════════════════════════════
// TITLE → SLUG AUTO-GENERATION
// slugify() is from admin-shared.js
// ════════════════════════════════════════════════════════════════════

function onTitleInput() {
  // Only auto-generate for brand-new posts that have not had their slug manually edited
  if (!isNew || slugDirty) return;
  document.getElementById('f-slug').value =
    slugify(document.getElementById('f-title').value);
}

function regenSlug() {
  document.getElementById('f-slug').value =
    slugify(document.getElementById('f-title').value);
}

// ════════════════════════════════════════════════════════════════════
// HERO IMAGE
// openMediaPicker() is from media-picker.js — the entire integration is one call
// ════════════════════════════════════════════════════════════════════

function pickHero() {
  openMediaPicker(function(media) {
    setHeroPreview(media.public_url);
    showToast('Hero-bild vald.', 't-green');
  });
}

function clearHero() {
  setHeroPreview('');
}

function setHeroPreview(url) {
  var thumb    = document.getElementById('hero-thumb');
  var ph       = document.getElementById('hero-placeholder');
  var clearBtn = document.getElementById('clear-hero-btn');
  var note     = document.getElementById('hero-url-note');

  heroUrl = url || '';

  if (url) {
    thumb.src              = url;
    thumb.style.display    = 'block';
    ph.style.display       = 'none';
    clearBtn.style.display = '';
    note.textContent       = url;
  } else {
    thumb.style.display    = 'none';
    ph.style.display       = 'flex';
    clearBtn.style.display = 'none';
    note.textContent       = '';
  }
}

// ════════════════════════════════════════════════════════════════════
// STATUS / PUBLISH DATE
// ════════════════════════════════════════════════════════════════════

function onStatusChange() {
  var s = document.getElementById('f-status').value;
  document.getElementById('publish-at-row').style.display =
    s === 'scheduled' ? '' : 'none';
}

// ════════════════════════════════════════════════════════════════════
// SEO CHARACTER COUNTERS
// ════════════════════════════════════════════════════════════════════

function updateSeoLens() {
  var t = document.getElementById('f-seo-title').value.length;
  var d = document.getElementById('f-seo-desc').value.length;
  document.getElementById('seo-title-len').textContent = t + '/60';
  document.getElementById('seo-desc-len').textContent  = d + '/160';
}

// ════════════════════════════════════════════════════════════════════
// LIVE STATS
// getContentStats() is from markdown-renderer.js
// ════════════════════════════════════════════════════════════════════

function updateStats() {
  if (!easyMDE) return;
  var s = getContentStats(easyMDE.value());
  document.getElementById('editor-stats').textContent =
    s.wordCount + ' ord · ' + s.charCount + ' tecken · ca ' +
    s.readingTimeMinutes + ' min läsning';
}

// ════════════════════════════════════════════════════════════════════
// LOAD  (edit mode)
// Note: EasyMDE content is injected AFTER initEditor() in the init flow above,
// not here, because easyMDE does not exist yet when loadPost() is called.
// ════════════════════════════════════════════════════════════════════

async function loadPost(id) {
  var res = await supabaseClient
    .from('blog_posts')
    .select('*')
    .eq('id', id)
    .single();

  if (res.error || !res.data) {
    showToast(
      'Kunde inte ladda artikeln: ' + (res.error ? res.error.message : 'okänt fel'),
      't-red'
    );
    return;
  }

  existingPost = res.data;

  document.getElementById('page-title').textContent = 'Redigera artikel';
  document.title = (res.data.title || 'Artikel') + ' – Nordic PC Admin';

  document.getElementById('f-title').value     = res.data.title    || '';
  document.getElementById('f-slug').value      = res.data.slug     || '';
  document.getElementById('f-status').value    = res.data.status   || 'draft';
  document.getElementById('f-language').value  = res.data.language || 'sv';
  document.getElementById('f-excerpt').value   = res.data.excerpt  || '';
  document.getElementById('f-seo-title').value = res.data.seo_title        || '';
  document.getElementById('f-seo-desc').value  = res.data.seo_description  || '';

  if (res.data.publish_at) {
    document.getElementById('f-publish-at').value = res.data.publish_at.slice(0, 16);
  }

  if (res.data.hero_image_url) {
    setHeroPreview(res.data.hero_image_url);
  }
}

// ════════════════════════════════════════════════════════════════════
// SAVE
// New post: INSERT then redirect to blog-editor.html?id={newId}
// Existing: UPDATE in place, show toast
// ════════════════════════════════════════════════════════════════════

async function savePost() {
  var title    = document.getElementById('f-title').value.trim();
  var slug     = document.getElementById('f-slug').value.trim();
  var content  = easyMDE.value();
  var status   = document.getElementById('f-status').value;
  var language = document.getElementById('f-language').value;
  var excerpt  = document.getElementById('f-excerpt').value.trim()   || null;
  var seoTitle = document.getElementById('f-seo-title').value.trim() || null;
  var seoDesc  = document.getElementById('f-seo-desc').value.trim()  || null;
  var publishAtRaw = document.getElementById('f-publish-at').value;
  var publish_at   = (status === 'scheduled' && publishAtRaw)
    ? new Date(publishAtRaw).toISOString()
    : null;

  if (!title) { showToast('Rubrik krävs.', 't-red'); return; }
  if (!slug)  { showToast('Slug krävs.', 't-red');   return; }

  var payload = {
    title:           title,
    slug:            slug,
    content:         content,
    excerpt:         excerpt,
    hero_image_url:  heroUrl || null,
    seo_title:       seoTitle,
    seo_description: seoDesc,
    status:          status,
    language:        language,
    publish_at:      publish_at,
    updated_at:      new Date().toISOString(),
    // TODO (next pass): replace null with document.getElementById('f-category').value || null
    // once the category selector is built (see sidebar TODO above)
    category_id:     existingPost ? existingPost.category_id    : null,
    // TODO (next pass): replace null with document.getElementById('f-cta').value || null
    // once the CTA template selector is built (see sidebar TODO above)
    cta_template_id: existingPost ? existingPost.cta_template_id : null,
  };

  if (!isNew) {
    // ── UPDATE existing post ──
    var upd = await supabaseClient
      .from('blog_posts')
      .update(payload)
      .eq('id', postId);

    if (upd.error) {
      showToast(
        upd.error.message.includes('unique')
          ? 'En artikel med denna slug finns redan.'
          : 'Sparfel: ' + upd.error.message,
        't-red'
      );
      return;
    }

    if (existingPost) Object.assign(existingPost, payload);
    document.title = title + ' – Nordic PC Admin';
    showToast('Artikel sparad.', 't-green');

  } else {
    // ── INSERT new post, then redirect to edit mode ──
    var ins = await supabaseClient
      .from('blog_posts')
      .insert(payload)
      .select('id')
      .single();

    if (ins.error) {
      showToast(
        ins.error.message.includes('unique')
          ? 'En artikel med denna slug finns redan.'
          : 'Sparfel: ' + ins.error.message,
        't-red'
      );
      return;
    }

    // Redirect so the page re-initialises cleanly in edit mode with the new ID.
    // EasyMDE autosave on the returned page will use key 'npc-blog-{id}' (not 'npc-blog-new'),
    // so the draft from create mode doesn't interfere.
    window.location.href = 'blog-editor.html?id=' + ins.data.id;
  }
}
</script>
</body>
</html>
